<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAHS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ===== armazón: solo el contenedor de la pantalla ===== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #f4f6f8; color: #14181f;
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font-family: inherit; cursor: pointer; }
.escena { height: 100vh; overflow: auto; display: flex; justify-content: center; align-items: flex-start; }
.marco { flex-shrink: 0; overflow: hidden; }
.lienzo { transform-origin: top left; }
[data-ir], [data-privilegio] { cursor: pointer; }
</style>
<style>
/* ===== estilos originales de las pantallas ===== */
  .dc-root { margin: 0; background: #f4f6f8; color: #14181f;
           font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #2f5fd0; text-decoration: none; }
    a:hover { color: #1e4099; text-decoration: underline; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #9fb4dd; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #cdd4dd; border-radius: 6px; }
    select { font-family: inherit; }
    select:focus { outline: none; border-color: #9fb4dd; }
    input, select { font-family: inherit; }
    input:focus, select:focus { outline: none; border-color: #9fb4dd; }
    input:focus { outline: none; border-color: #9fb4dd; }
    .slot { transition: background 0.12s, border-color 0.12s, box-shadow 0.12s; }
    .slot-libre:hover { background: #d3ebdd !important; border-color: #3f8f63 !important;
                        box-shadow: 0 1px 4px rgba(47,107,69,0.22); }
    .slot-puesta:hover { box-shadow: 0 2px 6px rgba(20,24,31,0.18); }
    .slot-bloq { cursor: default; }
    .fila-off { cursor: default; }
</style>
</head>
<body>

<div class="escena" id="escena">
  <div class="marco" id="marco"><div class="lienzo" id="lienzo"></div></div>
</div>

<!-- ===================== plantillas de las pantallas ===================== -->
<template id="tpl-login">
<div style="width: 1440px; min-height: 980px; display: flex; flex-direction: column; background: #f4f6f8;">
  <div style="display: flex; align-items: center; gap: 20px; padding: 0 28px; height: 60px; background: #14181f; color: #fff; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="4.5" width="18" height="16" rx="2"></rect>
        <path d="M3 9.5h18M8.5 4.5V2.5M15.5 4.5V2.5M9 14h6"></path>
      </svg>
      <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">SAHS</span>
      <span style="font-size: 12px; color: #8b95a5; letter-spacing: 0.02em;">Sistema de Administración de Horarios</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; justify-content: center; align-items: flex-start; gap: 28px; padding: 96px 44px 40px;">

    <!-- ======= formulario: POST /usuario/login ======= -->
    <div style="width: 440px; display: flex; flex-direction: column; gap: 22px; padding: 34px 34px 30px; border-radius: 14px; background: #fff; border: 1px solid #e2e6ec; box-shadow: 0 10px 30px rgba(20,24,31,0.06);">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="font-size: 12px; color: #6b7482; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600;">Colegio Don Bosco · Nivel secundario</div>
        <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.025em;">Ingresar</div>
        <div style="font-size: 13px; color: #6b7482; line-height: 1.5;">Entrá con tu usuario. El menú muestra las secciones que habilita tu rol.</div>
      </div>

      <label style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 12.5px; font-weight: 600; color: #4a5462;">Usuario o email</span>
        <input value="{{usuario}}" onChange="{{setUsuario}}" placeholder="por ejemplo, secretaria" autocomplete="username" style="height: 42px; padding: 0 13px; border-radius: 8px; border: 1px solid #d3d9e2; background: #fff; font-size: 14px; color: #14181f;">
      </label>

      <label style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 12.5px; font-weight: 600; color: #4a5462;">Contraseña</span>
        <input type="password" value="{{clave}}" onChange="{{setClave}}" autocomplete="current-password" style="height: 42px; padding: 0 13px; border-radius: 8px; border: 1px solid #d3d9e2; background: #fff; font-size: 14px; color: #14181f;">
      </label>

      <sc-if value="{{hayError}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 9px; font-size: 13px; color: #a3322b; background: #fdf1f0; border: 1px solid #f3cfcb; border-radius: 8px; padding: 11px 13px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16v.5"></path></svg>
          {{error}}
        </div>
      </sc-if>

      <sc-if value="{{hayHecho}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 9px; font-size: 13px; color: #2f6b45; background: #eef6f1; border: 1px solid #cfe5d7; border-radius: 8px; padding: 11px 13px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>
          {{hecho}}
        </div>
      </sc-if>

      <button onClick="{{entrar}}" style="height: 44px; border-radius: 8px; border: none; background: {{accent}}; color: #fff; font-size: 14px; font-weight: 600;">Ingresar</button>
    </div>

    <!-- ======= usuarios de ejemplo (solo para la demo) ======= -->
    <div style="width: 400px; display: flex; flex-direction: column; gap: 12px; padding: 24px 24px 22px; border-radius: 14px; background: #fafbfc; border: 1px dashed #d3d9e2;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 13px; font-weight: 600;">Usuarios de ejemplo</div>
        <div style="font-size: 12px; color: #6b7482; line-height: 1.5;">Tocá uno para completar el usuario. En el prototipo sirve cualquier contraseña que no esté vacía.</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <sc-for list="{{ejemplos}}" as="u" hint-placeholder-count="10">
          <button onClick="{{u.elegir}}" style="{{u.estilo}}">
            <span class="mono" style="font-size: 13px; font-weight: 600; flex-grow: 1; text-align: left;">{{u.nombre}}</span>
            <span style="font-size: 12px; color: #6b7482;">{{u.rol}}</span>
          </button>
        </sc-for>
      </div>
    </div>

  </div>
</div>
</template>

<template id="tpl-menu">
<div style="width: 1440px; min-height: 980px; display: flex; flex-direction: column; background: #f4f6f8;">

  <div style="display: flex; align-items: center; gap: 20px; padding: 0 28px; height: 60px; background: #14181f; color: #fff; flex-shrink: 0;">
    <div data-ir="A1" title="Ir al inicio" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="4.5" width="18" height="16" rx="2"></rect>
        <path d="M3 9.5h18M8.5 4.5V2.5M15.5 4.5V2.5M9 14h6"></path>
      </svg>
      <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">SAHS</span>
      <span style="font-size: 12px; color: #8b95a5; letter-spacing: 0.02em;">Sistema de Administración de Horarios</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 9px; padding: 0 5px 0 11px; height: 36px; border-radius: 8px; background: #1d222b; border: 1px solid #2f3743;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b95a5" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M3 9.5h18M8.5 4.5V2.5M15.5 4.5V2.5"></path></svg>
      <span style="font-size: 12px; color: #8b95a5;">Ciclo lectivo</span>
      <select value="{{cicloG.valor}}" onChange="{{cicloG.cambiar}}" style="height: 26px; padding: 0 6px; border-radius: 6px; border: 1px solid #3a4250; background: #262c36; color: #fff; font-size: 12.5px; font-weight: 600;">
        <sc-for list="{{cicloG.opciones}}" as="o" hint-placeholder-count="2">
          <option value="{{o.valor}}">{{o.label}}</option>
        </sc-for>
      </select>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 9px; font-size: 13px; color: #c3cad4; padding-right: 4px; white-space: nowrap;">
        <div style="width: 26px; height: 26px; border-radius: 50%; background: #3a4250; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff;">{{sesion.iniciales}}</div>
        <span><span style="color: #fff; font-weight: 600;">{{sesion.nombre}}</span> · {{sesion.rol}}</span>
      </div>
      <button data-ir="A18" title="Cambiar mi contraseña" aria-label="Cambiar mi contraseña" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; width: 32px; padding: 0; border-radius: 7px; border: 1px solid #2f3743; background: #1d222b; color: #c3cad4; font-size: 12px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
      </button>
      <button onClick="{{sesion.salir}}" data-accion="salir" title="Cerrar sesión" aria-label="Cerrar sesión" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; width: 32px; padding: 0; border-radius: 7px; border: 1px solid #2f3743; background: #1d222b; color: #c3cad4; font-size: 12px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l5-5-5-5M15 12H4"></path></svg>
      </button>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 24px; padding: 30px 44px 26px; background: #fff; border-bottom: 1px solid #e2e6ec; flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-size: 12px; color: #6b7482; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600;">Colegio Don Bosco · Nivel secundario</div>
      <div style="font-size: 30px; font-weight: 600; letter-spacing: -0.025em;">Inicio</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 15px; border-radius: 8px; border: 1px solid #e2e6ec; background: #fafbfc;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b7482" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M3 9.5h18"></path>
      </svg>
      <span style="font-size: 13px; color: #4a5462;">Ciclo lectivo</span>
      <span class="mono" style="font-size: 13px; font-weight: 600;">{{cicloG.valor}}</span>
      <span style="font-size: 12px; color: #6b7482;">· {{cicloG.estado}}</span>
    </div>
  </div>

  <div style="padding: 26px 44px 34px; display: flex; flex-direction: column; gap: 28px;">

    <!-- ======= privilegios del rol: una tarjeta por privilegio, sin agrupar ======= -->
    <div style="display: flex; flex-direction: column; gap: 13px;">
      <div style="display: flex; align-items: baseline; gap: 11px;">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em;">{{rolTitulo}}</span>
        <span style="font-size: 12px; color: #7a8393;">{{rolDetalle}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">
        <sc-for list="{{tarjetas}}" as="p" hint-placeholder-count="11">
          <button onClick="{{p.click}}" data-privilegio="{{p.id}}" style="{{p.estilo}}">
            <span style="{{p.iconoEstilo}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="{{p.icono}}"></path>
              </svg>
            </span>
            <span style="font-size: 14px; font-weight: 600; text-align: left; flex-grow: 1;">{{p.descripcion}}</span>
            <span style="{{p.chipEstilo}}">{{p.chip}}</span>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{sinTarjetas}}" hint-placeholder-val="{{false}}">
        <div style="font-size: 12.5px; color: #a56a10; background: #fdf6ec; border: 1px solid #f1dfc0; border-radius: 8px; padding: 12px 14px;">El rol no tiene privilegios asignados, así que el menú queda vacío. Se asignan en Usuarios → Roles.</div>
      </sc-if>
    </div>

    <div style="{{pieEstilo}}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{pieIcono}}" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 11.5v5M12 8v.5"></path>
      </svg>
      <span style="font-size: 12.5px; color: {{pieTexto}}; line-height: 1.55;">{{pieMensaje}}</span>
    </div>

  </div>
</div>
</template>

<template id="tpl-disponibilidad">
<div style="width: 1440px; min-height: 980px; display: flex; flex-direction: column; background: #f4f6f8;">

  <div style="display: flex; align-items: center; gap: 20px; padding: 0 28px; height: 60px; background: #14181f; color: #fff; flex-shrink: 0;">
    <div data-ir="A1" title="Ir al inicio" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="4.5" width="18" height="16" rx="2"></rect>
        <path d="M3 9.5h18M8.5 4.5V2.5M15.5 4.5V2.5M9 14h6"></path>
      </svg>
      <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">SAHS</span>
      <span style="font-size: 12px; color: #8b95a5; letter-spacing: 0.02em;">Sistema de Administración de Horarios</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 9px; padding: 0 5px 0 11px; height: 36px; border-radius: 8px; background: #1d222b; border: 1px solid #2f3743;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b95a5" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M3 9.5h18M8.5 4.5V2.5M15.5 4.5V2.5"></path></svg>
      <span style="font-size: 12px; color: #8b95a5;">Ciclo lectivo</span>
      <select value="{{cicloG.valor}}" onChange="{{cicloG.cambiar}}" style="height: 26px; padding: 0 6px; border-radius: 6px; border: 1px solid #3a4250; background: #262c36; color: #fff; font-size: 12.5px; font-weight: 600;">
        <sc-for list="{{cicloG.opciones}}" as="o" hint-placeholder-count="2">
          <option value="{{o.valor}}">{{o.label}}</option>
        </sc-for>
      </select>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 9px; font-size: 13px; color: #c3cad4; padding-right: 4px; white-space: nowrap;">
        <div style="width: 26px; height: 26px; border-radius: 50%; background: #3a4250; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff;">{{sesion.iniciales}}</div>
        <span><span style="color: #fff; font-weight: 600;">{{sesion.nombre}}</span> · {{sesion.rol}}</span>
      </div>
      <button data-ir="A18" title="Cambiar mi contraseña" aria-label="Cambiar mi contraseña" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; width: 32px; padding: 0; border-radius: 7px; border: 1px solid #2f3743; background: #1d222b; color: #c3cad4; font-size: 12px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
      </button>
      <button onClick="{{sesion.salir}}" data-accion="salir" title="Cerrar sesión" aria-label="Cerrar sesión" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; width: 32px; padding: 0; border-radius: 7px; border: 1px solid #2f3743; background: #1d222b; color: #c3cad4; font-size: 12px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l5-5-5-5M15 12H4"></path></svg>
      </button>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 24px; padding: 22px 28px 18px; background: #fff; border-bottom: 1px solid #e2e6ec; flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b7482;">
        <span>Ciclo lectivo 2026</span>
        <span style="color: #c3cad4;">/</span>
        <span>Relevamiento previo al armado</span>
      </div>
      <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em;">Disponibilidad horaria declarada</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <button onClick="{{guardar}}" style="height: 38px; padding: 0 18px; border-radius: 7px; border: none; background: {{accent}}; color: #fff; font-size: 13px; font-weight: 600;">{{textoGuardar}}</button>
  </div>

  <div style="display: flex; gap: 18px; padding: 20px 28px 28px; align-items: flex-start;">

    <div style="width: 262px; flex-shrink: 0; background: #fff; border: 1px solid #e2e6ec; border-radius: 10px; overflow: hidden;">
      <div style="padding: 14px 16px 11px; border-bottom: 1px solid #eef1f5;">
        <div style="font-size: 13px; font-weight: 600;">Docentes</div>
        <div style="font-size: 12px; color: #6b7482; margin-top: 3px;">10 de 94 relevados</div>
      </div>
      <div style="max-height: 560px; overflow-y: auto;">
        <sc-for list="{{docentes}}" as="d" hint-placeholder-count="8">
          <button onClick="{{d.click}}" style="{{d.estilo}}">
            <span style="{{d.avatarEstilo}}">{{d.iniciales}}</span>
            <span style="display: flex; flex-direction: column; gap: 1px; text-align: left; min-width: 0; flex-grow: 1;">
              <span style="font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{d.nombre}}</span>
              <span class="mono" style="font-size: 10.5px; color: #7a8393;">{{d.declaradas}} franjas</span>
            </span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="flex-grow: 1; min-width: 0; background: #fff; border: 1px solid #e2e6ec; border-radius: 10px; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 14px; padding: 15px 20px; border-bottom: 1px solid #eef1f5;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 14px; font-weight: 600;">{{docenteNombre}}</div>
          <div style="font-size: 12px; color: #6b7482;">{{docenteMaterias}}</div>
        </div>
        <div style="flex-grow: 1;"></div>
        <div style="font-size: 11.5px; color: #6b7482;">Hacé clic en una franja para marcarla o desmarcarla</div>
      </div>

      <div style="padding: 18px 20px 22px;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px;">
          <span style="font-size: 12px; color: #6b7482;">Turno</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <sc-for list="{{turnos}}" as="t" hint-placeholder-count="4">
              <button onClick="{{t.click}}" style="{{t.estilo}}">{{t.nombre}}<span class="mono" style="{{t.cuentaEstilo}}">{{t.cuenta}}</span></button>
            </sc-for>
          </div>
          <div style="flex-grow: 1;"></div>
          <span class="mono" style="font-size: 11.5px; color: #8b95a5;">{{turnoHorario}}</span>
        </div>

        <div style="display: grid; grid-template-columns: 104px repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px;">
          <div></div>
          <sc-for list="{{dias}}" as="d" hint-placeholder-count="5">
            <div style="font-size: 12px; color: #4a5462; text-align: center; font-weight: 500;">{{d.nombre}}</div>
          </sc-for>

/* Ciclo lectivo global: el mismo en todas las pantallas del administrativo.
   Se guarda en el navegador y se avisa a las demás pantallas abiertas. */
var CicloGlobal = (function () {
  var BASE = [
    { anio: 2025, inicio: '03/03/2025', fin: '12/12/2025', estado: 'Cerrado' },
    { anio: 2026, inicio: '02/03/2026', fin: '11/12/2026', estado: 'En curso' }
  ];
  var datos = { activo: 2026, lista: BASE.slice() };
  try {
    if (window.top) {
      if (!window.top.__SAHS_CICLO) window.top.__SAHS_CICLO = datos;
      datos = window.top.__SAHS_CICLO;
    }
  } catch (e) {}
  var canal = null;
  try { canal = new BroadcastChannel('sahs-ciclo'); } catch (e) {}
  var oyentes = [];
  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }
  if (canal) canal.onmessage = avisar;
  try {
    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf('sahs.') === 0) avisar();
    });
  } catch (e) {}
  function leer() {
    try {
      var l = localStorage.getItem('sahs.ciclos');
      var a = localStorage.getItem('sahs.cicloActivo');
      if (l) datos.lista = JSON.parse(l);
      if (a) datos.activo = Number(a);
    } catch (e) {}
    return datos;
  }
  function guardar() {
    try {
      localStorage.setItem('sahs.ciclos', JSON.stringify(datos.lista));
      localStorage.setItem('sahs.cicloActivo', String(datos.activo));
    } catch (e) {}
    try { if (canal) canal.postMessage('cambio'); } catch (e) {}
  }
  var api = {
    activo: function () { return leer().activo; },
    lista: function () {
      return leer().lista.slice().sort(function (a, b) { return b.anio - a.anio; });
    },
    info: function (anio) {
      var l = leer().lista;
      for (var i = 0; i < l.length; i++) if (l[i].anio === Number(anio)) return l[i];
      return null;
    },
    fijar: function (anio) { leer(); datos.activo = Number(anio); guardar(); avisar(); },
    agregar: function (c) { leer(); datos.lista.push(c); guardar(); avisar(); },
    escuchar: function (f) { oyentes.push(f); },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__cicloOyente) {
          this.__cicloOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        var v = original.call(this) || {};
        var act = api.activo();
        var inf = api.info(act);
        v.cicloG = {
          valor: String(act),
          estado: inf ? inf.estado : '',
          opciones: api.lista().map(function (c) {
            return { valor: String(c.anio), label: c.anio + ' · ' + c.estado.toLowerCase() };
          }),
          cambiar: function (e) { api.fijar(e.target.value); }
        };
        return v;
      };
    }
  };
  return api;
})();

      mb: { n: 'Miguel Bernal',    mats: ['Artística'],                 asig: 2, av: ['1111000','0000000','1111000','0000000','1111000'] }
    };

    var disp = {};

  // Pasa los datos de ejemplo (una fila por día, '1' = disponible en esa hora cátedra,
  // en el orden del turno) a ids de franja del turno (ej. 'TM-1-3'). Los recreos nunca se marcan.
  idsDe(turno, filas) {
    var out = [];
    Catalogo.franjasPorDia(turno).forEach(function (f) {
      var fila = filas[f.diaIndex] || '';
      if (!f.es_recreo && fila.charAt(f.hora - 1) === '1') out.push(f.id);
    });
    return out;
  }

  horasDe(turno) {
    return Catalogo.franjasPorDia(turno)
      .filter(function (f) { return !f.es_recreo; })
      .map(function (f) { return f.id; });
  }

  // Cuántas franjas válidas (de algún turno, sin recreos) hay en la lista.
  contarEn(ids, turno) {
    var set = {};
    ids.forEach(function (id) { set[id] = true; });
    var nombres = turno ? [turno] : Catalogo.turnos().map(function (t) { return t.nombre; });
    var n = 0, self = this;
    nombres.forEach(function (t) { self.horasDe(t).forEach(function (id) { if (set[id]) n++; }); });
    return n;
  }

  // El turno donde hay más franjas declaradas; si no hay ninguna, Mañana (o el primero).
  turnoPreferido(ids) {
    var self = this, mejor = null, max = 0;
    var turnos = Catalogo.turnos();
    turnos.forEach(function (t) {
      var n = self.contarEn(ids, t.nombre);
      if (n > max) { max = n; mejor = t.nombre; }
    });
    if (mejor) return mejor;
    return turnos.some(function (t) { return t.nombre === 'Mañana'; }) ? 'Mañana' : (turnos[0] ? turnos[0].nombre : '');
  }

  // Arma la grilla del turno: una fila por bloque (horas y recreos) y una columna por día.
  grilla(turno, ids, alto, alternar) {

    Catalogo.franjasPorDia(turno).forEach(function (f) { porClave[f.diaIndex + '-' + f.orden] = f; });
    return bloques.map(function (b, k) {

      if (b.es_recreo) return { esRecreo: true, esHora: false, hora: '', horario: horario, celdas: [] };
      var celdas = Catalogo.DIAS.map(function (dia, d) {

  // Ubica cada materia respetando: una sola clase por franja del curso, docente sin

  // Si un docente no tiene cargada una hora, se la toma como no disponible.
  generarPlan(horas, respetar, H) {
    var self = this;
    var horasDia = []; for (var x = 0; x < H; x++) horasDia.push(x);
    var grid = this.DAYS.map(function () { return horasDia.map(function () { return null; }); });

    var disponible = function (s, d, sl) {
      return s.t.every(function (tid) { return self.T[tid].av[d].charAt(sl) === '1'; });
    };
    var admite = function (s, d, sl) { return !respetar || disponible(s, d, sl); };
    var docenteLibre = function (s, d, sl) {

    var cargaDia = function (d) { return grid[d].filter(function (c) { return !!c; }).length; };
    var poner = function (s, d, sl) {
      grid[d][sl] = { id: s.id, n: s.n, area: s.area, t: s.t, forzada: !disponible(s, d, sl) };

          self.S.forEach(function (x) { if (x.id === ocupa.id) otra = x; });

            for (var s2 = 0; s2 < H && !resuelto; s2++) {

              if (!admite(otra, d2, s2)) continue;
              sacar(d1, s1);
              if (!docenteLibre(f, d1, s1)) { poner(otra, d1, s1); continue; }

              if (!docenteLibre(otra, d2, s2) || enDia(d2, otra.id) >= 2) {

              }
              poner(otra, d2, s2);

            + ' background: ' + (cell.forzada ? '#fdf1e3' : a.fondo) + ';'
            + ' border: 1px ' + (cell.forzada ? 'dashed #e0a458' : 'solid ' + a.borde) + ';'
            + (esEpa && !cell.forzada ? ' background-image: repeating-linear-gradient(135deg, rgba(122,84,196,0.07) 0 6px, transparent 6px 12px);' : ''),
          titulo: cell.n,

          tituloEstilo: 'font-size: 12px; font-weight: 600; color: ' + (cell.forzada ? '#8a4b12' : a.texto)
            + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2;',
          subEstilo: 'font-size: 10px; color: ' + (cell.forzada ? '#8a4b12' : a.texto) + '; opacity: 0.82;'
            + ' white-space: nowrap; overflow: hidden; text-overflow: ellipsis;'

        + 'bajá la carga horaria de esa materia o ampliá la disponibilidad declarada.';
    } else if (forzadas > 0) {
      hayAviso = true;
      textoAviso = forzadas + ' hora(s) quedaron asignadas fuera de la disponibilidad declarada, marcadas con ⚠ en la grilla. '
        + 'Entran todas las materias, pero esos docentes no pueden dictarlas en esa franja.';

      dias: this.DAYS.map(function (n) { return { nombre: n }; }),

      }
    } catch (e) {}
    return this.HABIL[m] || [];
  }

  // Todas las clases (curso + materia) con sus franjas semanales: [{ d, h }] con h = 1ª, 2ª, …
  todasLasClases() {
    var self = this, mapa = {}, lista = [], nHoras = this.horasDelTurno();
    this.CURSOS.forEach(function (curso) {
      self.GRIDS[curso].forEach(function (fila, d) {
        fila.forEach(function (c, i) {
          if (!c || i >= nHoras) return;
          var id = curso + '|' + c.m;
          if (!mapa[id]) { mapa[id] = { id: id, curso: curso, m: c.m, t: c.t, slots: [] }; lista.push(mapa[id]); }
          mapa[id].slots.push({ d: d, h: i + 1 });
        });
      });
    });
    return lista;
  }
  clase(id) { return this.todasLasClases().filter(function (c) { return c.id === id; })[0] || null; }
  clasesDe(tid) { return tid ? this.todasLasClases().filter(function (c) { return c.t.indexOf(tid) >= 0; }) : []; }

  // Franjas de la clase que caen en el período (por día de la semana) y cuántas horas suman en total.
  enPeriodo(clase, ctx) {
    var dias = this.diasHabiles(ctx), presentes = {};
    dias.forEach(function (x) { presentes[x.d] = true; });
    var franjas = clase.slots.filter(function (s) { return presentes[s.d]; });
    var horas = 0;
    dias.forEach(function (x) { clase.slots.forEach(function (s) { if (s.d === x.d) horas++; }); });
    return { franjas: franjas, horas: horas };
  }

  textoFranjas(franjas) {
    var self = this, porDia = {};
    franjas.forEach(function (f) { (porDia[f.d] = porDia[f.d] || []).push(f.h + 'ª'); });
    return Object.keys(porDia).map(function (d) {
      var hs = porDia[d];
      return self.DAYS[d].slice(0, 3) + ' ' + (hs.length > 1 ? hs.slice(0, -1).join(', ') + ' y ' + hs[hs.length - 1] : hs[0]);
    }).join(' · ');
  }

  // Por qué un profesor no puede cubrir la clase entera en el período (null si puede).
  // Revisa disponibilidad en cada franja, otras clases propias y otras suplencias de esta novedad.
  impedimento(tid, clase, ctx) {
    var self = this;
    var franjas = this.enPeriodo(clase, ctx).franjas;
    var otras = this.clasesDe(ctx.ausente).filter(function (k) { return k.id !== clase.id && ctx.asign[k.id] === tid; });
    for (var i = 0; i < franjas.length; i++) {
      var f = franjas[i], cuando = this.DAYS[f.d] + ' ' + f.h + 'ª hora';
      if (this.T[tid].av[f.d].charAt(f.h - 1) !== '1') return 'No declaró disponibilidad el ' + cuando + '.';
      for (var c = 0; c < this.CURSOS.length; c++) {
        var cel = this.GRIDS[this.CURSOS[c]][f.d][f.h - 1];
        if (cel && cel.t.indexOf(tid) >= 0) return 'Tiene ' + this.MAT[cel.m].n + ' en ' + this.CURSOS[c] + ' el ' + cuando + '.';
      }
      for (var o = 0; o < otras.length; o++) {
        var cruza = this.enPeriodo(otras[o], ctx).franjas.some(function (g) { return g.d === f.d && g.h === f.h; });
        if (cruza) return 'Ya cubre ' + this.MAT[otras[o].m].n + ' en ' + otras[o].curso + ' el ' + cuando + '.';
      }
    }
    return null;
  }

  cargaSemanal(tid) {
    return this.clasesDe(tid).reduce(function (n, c) { return n + c.slots.length; }, 0);
  }

  // Al cambiar el período se quitan las suplencias que ya no sirven: la clase no tiene horas
  // en el nuevo rango o el suplente deja de poder cubrirla entera.
  conPeriodo(desde, hasta) {
    var self = this;
    var ctx = Object.assign({}, this.state, { desde: desde, hasta: hasta });
    var quedan = {};
    Object.keys(ctx.asign).forEach(function (id) {
      var k = self.clase(id);
      if (!k || self.enPeriodo(k, ctx).horas === 0) return;
      var prueba = Object.assign({}, ctx, { asign: quedan });
      if (!self.impedimento(ctx.asign[id], k, prueba)) quedan[id] = ctx.asign[id];
    });
    var selK = this.state.sel ? this.clase(this.state.sel) : null;
    var sel = selK && this.enPeriodo(selK, ctx).horas > 0 ? this.state.sel : null;
    this.setState({ desde: desde, hasta: hasta, asign: quedan, sel: sel, errores: [], registro: null });
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var accent = this.props.accent || '#2f5fd0';
    var compacta = this.props.density === 'Compacta';
    var altoCelda = compacta ? 40 : 48;
    var campo = 'height: 32px; padding: 0 9px; border-radius: 6px; border: 1px solid #d5dbe3; background: #fff;'
      + ' font-family: inherit; font-size: 12.5px; color: #14181f; width: 100%; box-sizing: border-box;';
    var chip = function (activo) {
      return 'height: 28px; padding: 0 11px; border-radius: 14px; font-size: 12px; font-weight: 500;'
        + ' border: 1px solid ' + (activo ? accent : '#e2e6ec') + ';'
        + ' background: ' + (activo ? accent : '#fff') + '; color: ' + (activo ? '#fff' : '#4a5462') + ';';
    };

    var dias = this.diasHabiles(st);
    var periodoOk = dias.length > 0;
    var diasPresentes = {};
    dias.forEach(function (x) { diasPresentes[x.d] = true; });

    // ---- atajos de período
    var semanas = this.SEMANAS.map(function (s, i) {
      var activa = st.desde === s.desde && st.hasta === s.hasta;
      return {
        label: s.label,
        estilo: 'height: 32px; padding: 0 13px; border: 1px solid ' + (activa ? '#14181f' : '#e2e6ec')
          + '; background: ' + (activa ? '#14181f' : '#fff') + '; color: ' + (activa ? '#fff' : '#4a5462')
          + '; font-size: 12px; font-weight: 500;'
          + ' border-radius: ' + (i === 0 ? '7px 0 0 7px' : (i === 3 ? '0 7px 7px 0' : '0')) + ';'
          + (i > 0 ? ' margin-left: -1px;' : ''),
        click: function () { self.conPeriodo(s.desde, s.hasta); }
      };
    });
    var base = this.fecha(st.desde) || this.fecha('2026-05-11');
    var lunes = new Date(base); lunes.setDate(lunes.getDate() - ((lunes.getDay() + 6) % 7));
    var diasAtajo = this.DAYS.map(function (nombre, d) {
      var dt = new Date(lunes); dt.setDate(lunes.getDate() + d);
      var iso = self.iso(dt);
      var activo = st.desde === iso && st.hasta === iso;

    var periodoTexto = periodoOk

    var periodoEstilo = 'font-size: 11.5px; line-height: 1.45; color: ' + (periodoOk ? '#4a5462' : '#8f2d22') + ';';

    // ---- motivo
    var motivos = this.MOTIVOS.map(function (m) {
      return { label: m, estilo: chip(st.motivo === m), click: function () { self.setState({ motivo: m, errores: [], registro: null }); } };
    });

    // ---- docentes
    var docentes = Object.keys(this.T).map(function (tid) {
      var activo = st.ausente === tid;
      var cursos = [];
      self.clasesDe(tid).forEach(function (k) { if (cursos.indexOf(k.curso) < 0) cursos.push(k.curso); });
      return {
        nombre: self.T[tid].n,
        iniciales: self.iniciales(self.T[tid].n),
        detalle: self.cargaSemanal(tid) + ' h semanales · ' + cursos.join(', '),
        estilo: 'display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 16px; border: none;'
          + ' border-left: 3px solid ' + (activo ? '#c2621f' : 'transparent') + ';'
          + ' background: ' + (activo ? '#fdf1e3' : '#fff') + '; text-align: left;',
        avatarEstilo: 'width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex;'
          + ' align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600;'
          + ' background: ' + (activo ? '#c2621f' : '#eef1f5') + '; color: ' + (activo ? '#fff' : '#5b6471') + ';',
        click: function () {
          // Cambiar de docente ausente descarta las suplencias cargadas: son de otra novedad.
          var nuevo = st.ausente === tid ? null : tid;
          var primera = self.clasesDe(nuevo)[0];
          self.setState({ ausente: nuevo, sel: null, asign: {}, errores: [], registro: null,
                          cursoVista: primera ? primera.curso : st.cursoVista });
        }
      };
    });

    // ---- clases afectadas
    var afectadasL = this.clasesDe(st.ausente).map(function (k) {
      var p = self.enPeriodo(k, st);
      return { k: k, franjas: p.franjas, horas: p.horas };
    }).filter(function (x) { return x.horas > 0; });
    var afectadasPorId = {};
    afectadasL.forEach(function (x) { afectadasPorId[x.k.id] = x; });

    var cubiertas = 0, horasAfect = 0, horasCub = 0;
    afectadasL.forEach(function (x) {
      horasAfect += x.horas;
      if (st.asign[x.k.id]) { cubiertas++; horasCub += x.horas; }
    });

    var notaDe = function (k) {
      if (k.t.length < 2) return '';
      var otros = k.t.filter(function (t) { return t !== st.ausente; }).map(function (t) { return self.T[t].n; }).join(' y ');
      return 'Clase compartida: se cubre solo la parte de ' + self.T[st.ausente].n + '. ' + otros + ' sigue dictando con el suplente.';
    };

    var clases = afectadasL.map(function (x) {
      var k = x.k, sup = st.asign[k.id], sel = st.sel === k.id;
      return {
        titulo: self.MAT[k.m].n + ' · ' + k.curso,
        franjas: self.textoFranjas(x.franjas) + ' · ' + x.horas + ' h en el período',
        compartida: k.t.length > 1,
        notaCompartida: notaDe(k),
        estado: sup ? 'Supl. ' + self.T[sup].n : 'Sin suplente',
        estadoEstilo: 'flex-shrink: 0; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 12px;'
          + (sup ? ' background: #ecf5ef; color: #245239;' : ' background: #fdf1e3; color: #8a4b12;'),
        estilo: 'display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 18px; border: none;'
          + ' border-bottom: 1px solid #f4f6f8; border-left: 3px solid ' + (sel ? '#14181f' : 'transparent') + ';'
          + ' background: ' + (sel ? '#f6f8fa' : '#fff') + '; text-align: left;',
        click: function () { self.setState({ sel: sel ? null : k.id, cursoVista: k.curso }); }
      };
    });
    var clasesTitulo = st.ausente ? 'Clases de ' + this.T[st.ausente].n + ' en el período' : 'Clases a cubrir';
    var clasesSubtitulo = !st.ausente
      ? 'Elegí un docente ausente para ver sus clases.'
      : (!periodoOk ? 'El período no es válido.'
        : (clases.length ? 'Cada clase la cubre un solo suplente, en todas sus horas del período. Elegí una para ver candidatos.'
          : 'No tiene clases dentro del período elegido.'));

    // ---- cursos y grilla
    var cursosAus = [];
    this.clasesDe(st.ausente).forEach(function (k) { if (cursosAus.indexOf(k.curso) < 0) cursosAus.push(k.curso); });
    var cursoVista = st.cursoVista;
    var cursos = cursosAus.map(function (c) {
      return { label: c, estilo: chip(c === cursoVista), click: function () { self.setState({ cursoVista: c }); } };
    });

    var grid = this.GRIDS[cursoVista] || [];
    var diasGrilla = this.DAYS.map(function (nombre, d) {
      var dentro = !st.ausente || diasPresentes[d];
      return {
        nombre: nombre,
        estilo: 'font-size: 12px; text-align: center; padding-bottom: 3px; font-weight: 500; color: ' + (dentro ? '#4a5462' : '#b4bcc7') + ';'
      };
    });
    var filas = this.bloques().map(function (b) {
      var horario = b.inicio + '–' + b.fin;
      if (b.es_recreo) return { esRecreo: true, esHora: false, horario: horario, hora: '', celdas: [] };
      var celdas = self.DAYS.map(function (nombre, d) {
        var cell = grid[d] ? grid[d][b.hora - 1] : null;
        var id = cell ? cursoVista + '|' + cell.m : null;
        var afect = id && afectadasPorId[id] && diasPresentes[d];
        var supl = afect ? st.asign[id] : null;
        var seleccionada = id && st.sel === id && afect;
        var fondo = '#fcfdfe', borde = '#e8ecf1', color = '#6b7482', titulo = '', sub = '', peso = '500';
        if (cell) {
          titulo = self.MAT[cell.m].n;
          sub = cell.t.map(function (t) { return self.T[t].n; }).join(' + ');
          if (supl) {
            fondo = '#ecf5ef'; borde = '#c2e0cd'; color = '#245239'; peso = '600';
            sub = cell.t.map(function (t) { return t === st.ausente ? 'Supl. ' + self.T[supl].n : self.T[t].n; }).join(' + ');
          } else if (afect) {
            fondo = '#fdf1e3'; borde = '#f0d3ae'; color = '#8a4b12'; peso = '600';
          } else {
            fondo = '#f6f8fa'; borde = '#e2e6ec'; color = '#4a5462';
          }
        }
        return {
          titulo: titulo,
          sub: sub,
          estilo: 'height: ' + altoCelda + 'px; border-radius: 7px; display: flex; flex-direction: column;'
            + ' justify-content: center; align-items: flex-start; gap: 2px; padding: 0 9px; overflow: hidden;'
            + ' width: 100%; text-align: left;'
            + ' background: ' + fondo + ';'
            + ' border: 1px ' + (cell ? 'solid' : 'dashed') + ' ' + (seleccionada ? '#14181f' : borde) + ';'
            + (seleccionada ? ' box-shadow: 0 0 0 2px rgba(20,24,31,0.12);' : ''),
          tituloEstilo: 'font-size: 12px; font-weight: ' + peso + '; color: ' + color + ';'
            + ' white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; line-height: 1.2;',
          subEstilo: 'font-size: 10px; color: ' + color + '; opacity: 0.8;'
            + ' white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;',
          click: function () {
            // Cualquier hora de una clase afectada abre la clase entera.
            if (!afect) return;
            self.setState({ sel: st.sel === id ? null : id });
          }
        };
      });
      return { esRecreo: false, esHora: true, hora: b.hora + 'ª hora', horario: horario, celdas: celdas };
    });

    // ---- panel de candidatos
    var panelTitulo = 'Candidatos para cubrir';
    var panelSubtitulo = st.ausente
      ? (clases.length ? 'Elegí una de las ' + clases.length + ' clases afectadas para ver quién puede cubrirla.' : 'No hay clases para cubrir en el período.')
      : 'Elegí un docente ausente, el período y después una clase afectada.';
    var candidatos = [], noSirven = [], mostrarVacio = false, textoVacio = '';
    var yaAsignada = false, textoAsignada = '', notaCompartida = '';
    var selX = st.sel ? afectadasPorId[st.sel] : null;
    var avatar = function (fondo, color) {
      return 'width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex;'
        + ' align-items: center; justify-content: center; font-size: 11px; font-weight: 600;'
        + ' background: ' + fondo + '; color: ' + color + ';';
    };

    if (selX) {
      var k = selX.k;
      panelTitulo = self.MAT[k.m].n + ' · ' + k.curso;
      panelSubtitulo = self.textoFranjas(selX.franjas) + ' · ' + selX.horas + ' h del ' + this.corta(st.desde)
        + ' al ' + this.corta(st.hasta) + '. El suplente tiene que poder dar todas.';
      notaCompartida = notaDe(k);
      var asignado = st.asign[k.id];
      if (asignado) {

        textoAsignada = self.T[asignado].n + ' cubre ' + self.MAT[k.m].n + ' en ' + k.curso + ' del ' + this.corta(st.desde)
          + ' al ' + this.corta(st.hasta) + ' (' + selX.horas + ' h). Se suma a su liquidación del mes al registrar la suplencia.';
      } else {
        var posibles = this.habilitados(k.m).filter(function (tid) { return tid !== st.ausente && k.t.indexOf(tid) < 0; });
        posibles.forEach(function (tid) {
          var imp = self.impedimento(tid, k, st);
          if (imp) {
            noSirven.push({ nombre: self.T[tid].n, iniciales: self.iniciales(self.T[tid].n), motivo: imp,
                            avatarEstilo: avatar('#f4f6f8', '#9aa3af') });
          } else {
            candidatos.push({
              nombre: self.T[tid].n,
              iniciales: self.iniciales(self.T[tid].n),
              motivo: 'Disponible y libre en las ' + selX.franjas.length + ' franjas',
              carga: self.cargaSemanal(tid) + ' h semanales · habilitado en ' + self.MAT[k.m].n,
              avatarEstilo: avatar('#eef1f5', '#5b6471'),
              asignar: function () {

                self.setState({ asign: asign, errores: [], registro: null });
              }
            });

        });
        if (candidatos.length === 0) {

          textoVacio = posibles.length === 0
            ? self.MAT[k.m].n + ' no tiene otro docente habilitado en la institución. La clase queda descubierta: '
              + 'hay que reprogramarla o cubrirla con otra actividad.'
            : 'Nadie puede cubrir la clase entera en el período. Probá acortar el período o reprogramar la clase.';
        }
      }
    }

    // ---- registrar
    var registrar = function () {
      var s = self.state, err = [];
      var afect = self.clasesDe(s.ausente).filter(function (k) { return self.enPeriodo(k, s).horas > 0; });
      if (!s.ausente) err.push('Elegí el docente ausente.');
      if (!self.diasHabiles(s).length) err.push('El período no es válido: revisá las fechas desde y hasta.');
      if (!s.motivo) err.push('Elegí el motivo de la ausencia.');
      else if (s.motivo === 'Otro' && !String(s.motivoOtro || '').trim()) err.push('Contá el motivo en el campo de texto.');
      var conSuplente = afect.filter(function (k) { return s.asign[k.id]; });
      if (s.ausente && !conSuplente.length) err.push('Asigná un suplente al menos a una clase.');
      if (err.length) { self.setState({ errores: err, registro: null }); return; }
      // Una suplencia por suplente: cada una lleva sus clases (swagger: Suplencia.clases[]).
      var porSuplente = {};
      conSuplente.forEach(function (k) { (porSuplente[s.asign[k.id]] = porSuplente[s.asign[k.id]] || []).push(k); });
      var motivo = s.motivo === 'Otro' ? s.motivoOtro.trim() : s.motivo;
      var registro = Object.keys(porSuplente).map(function (tid) {
        return { texto: self.T[tid].n + ' cubre ' + porSuplente[tid].map(function (k) { return self.MAT[k.m].n + ' (' + k.curso + ')'; }).join(', ')
          + ' · ' + motivo };
      });
      var sinCubrir = afect.length - conSuplente.length;
      if (sinCubrir) registro.push({ texto: sinCubrir + (sinCubrir === 1 ? ' clase queda' : ' clases quedan') + ' sin suplente.' });
      self.setState({ errores: [], registro: registro });
    };

    var registroTitulo = st.registro
      ? 'Suplencia registrada · ' + this.T[st.ausente].n + ' · del ' + this.corta(st.desde) + ' al ' + this.corta(st.hasta)
      : '';

    return {
      accent: accent,
      campo: campo,
      semanas: semanas,
      diasAtajo: diasAtajo,
      desde: st.desde,
      hasta: st.hasta,
      setDesde: function (e) { self.conPeriodo(e.target.value, self.state.hasta); },
      setHasta: function (e) { self.conPeriodo(self.state.desde, e.target.value); },
      periodoTexto: periodoTexto,
      periodoEstilo: periodoEstilo,
      motivos: motivos,
      esOtro: st.motivo === 'Otro',
      motivoOtro: st.motivoOtro,

      docentes: docentes,
      clases: clases,
      clasesTitulo: clasesTitulo,
      clasesSubtitulo: clasesSubtitulo,
      hayVariosCursos: cursosAus.length > 1,
      cursos: cursos,
      tituloGrilla: 'Planilla vigente · ' + cursoVista + ' · ' + this.TURNO,
      diasGrilla: diasGrilla,
      filas: filas,
      hayAusente: !!st.ausente,
      afectadas: afectadasL.length,
      cubiertas: cubiertas,
      horasTexto: horasCub + ' de ' + horasAfect + ' horas del período con suplente',
      coberturaAncho: (afectadasL.length ? Math.round(cubiertas / afectadasL.length * 100) : 0) + '%',
      coberturaColor: (afectadasL.length && cubiertas === afectadasL.length) ? '#2f6b45' : '#c2621f',
      coberturaTexto: afectadasL.length === 0
        ? 'Sin clases afectadas en el período elegido.'
        : (cubiertas === afectadasL.length
            ? 'Todas las clases del período tienen suplente. Ya podés registrar la suplencia.'
            : (afectadasL.length - cubiertas) + ' clase(s) todavía sin suplente.'),
      panelTitulo: panelTitulo,
      panelSubtitulo: panelSubtitulo,
      hayNotaCompartida: !!notaCompartida,
      notaCompartida: notaCompartida,
      candidatos: candidatos,
      hayCandidatos: candidatos.length > 0,
      noSirven: noSirven,
      hayNoSirven: noSirven.length > 0,
      mostrarVacio: mostrarVacio,
      textoVacio: textoVacio,
      yaAsignada: yaAsignada,

  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }

  function leer() {

        datos.orientaciones = x.orientaciones; datos.materias = x.materias;
        datos.turnos = x.turnos || copia(BASE.turnos);

    try { localStorage.setItem(CLAVE, JSON.stringify({ orientaciones: datos.orientaciones, materias: datos.materias, turnos: datos.turnos })); } catch (e) {}
    try { if (canal) canal.postMessage('cambio'); } catch (e) {}

    for (var i = 0; i < l.length; i++) if (l[i].nombre === nombre) return l[i];
    return null;
  }
  function mismaMateria(m, n, a, o) { return m.n.toLowerCase() === n.toLowerCase() && m.a === a && m.o === o; }
  function buscarTurno(nombre) {
    var l = datos.turnos || [];
    for (var i = 0; i < l.length; i++) if (l[i].nombre === nombre) return l[i];

  }
  var api = {
    // ---- turnos: cada uno con su arreglo de franjas (horas cátedra) de lunes a viernes
    generarFranjas: generarFranjas,
    // ---- franjas como en el swagger: cada franja pertenece a un día lectivo y los
    // recreos también son franjas (es_recreo). El turno guarda solo sus horas cátedra;
    // los recreos se arman con el hueco entre dos horas que no vienen seguidas.
    DIAS: DIAS,
    bloques: function (nombre) {
      leer(); var t = buscarTurno(nombre);
      return t ? bloquesDe(t.franjas) : [];
    },
    franjasPorDia: function (nombre) {

    clave: function (m) { return m.n + '|' + m.a + '|' + m.o; },
    habilitar: function (n, a, o, docente) {

      });

    },
    deshabilitar: function (n, a, o, docente) {
      leer();

        if (mismaMateria(x, n, a, o)) x.doc = (x.doc || []).filter(function (d) { return d !== docente; });

    },
    materiasDe: function (anio, orientacion) {
      return api.materias().filter(function (m) { return m.a === Number(anio) && m.o === orientacion; });
    },
    agregarMateria: function (m) {
      leer();
      if (!buscarOr(m.o)) return 'La orientación ' + m.o + ' no existe.';
      if (buscarOr(m.o).anios.indexOf(m.a) < 0) return 'La orientación ' + m.o + ' no está asociada a ' + m.a + '° año.';
      if (datos.materias.some(function (x) { return mismaMateria(x, m.n, m.a, m.o); })) {

      });
      if (dup) return 'Ya existe otra orientación con ese nombre o ese código.';
      datos.materias.forEach(function (m) { if (m.o === nombre) m.o = cambios.nombre; });
      o.nombre = cambios.nombre; o.codigo = cambios.codigo; o.desc = cambios.desc;
      guardar();
      return null;
    },
    asociarAnio: function (nombre, anio) {
      leer();
      var o = buscarOr(nombre);
      if (o && o.anios.indexOf(anio) < 0) { o.anios.push(anio); o.anios.sort(); guardar(); }

    desasociarAnio: function (nombre, anio) {
      leer();
      var n = datos.materias.filter(function (m) { return m.o === nombre && m.a === anio; }).length;
      if (n > 0) return 'Primero quitá las ' + (n === 1 ? 'materia' : n + ' materias') + ' de ' + anio + '° año de esta orientación.';
      var o = buscarOr(nombre);
      if (o) { o.anios = o.anios.filter(function (x) { return x !== anio; }); guardar(); }
      return null;
    },
    eliminarOrientacion: function (nombre) {
      leer();
      if (datos.materias.some(function (m) { return m.o === nombre; })) return 'Tiene materias cargadas: primero hay que quitarlas.';

      guardar();

    conectar: function (C) {

var CicloGlobal = (function () {
  var BASE = [
    { anio: 2025, inicio: '03/03/2025', fin: '12/12/2025', estado: 'Cerrado' },
    { anio: 2026, inicio: '02/03/2026', fin: '11/12/2026', estado: 'En curso' }
  ];
  var datos = { activo: 2026, lista: BASE.slice() };
  try {
    if (window.top) {
      if (!window.top.__SAHS_CICLO) window.top.__SAHS_CICLO = datos;
      datos = window.top.__SAHS_CICLO;
    }
  } catch (e) {}
  var canal = null;
  try { canal = new BroadcastChannel('sahs-ciclo'); } catch (e) {}
  var oyentes = [];
  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }
  if (canal) canal.onmessage = avisar;
  try {
    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf('sahs.') === 0) avisar();
    });
  } catch (e) {}
  function leer() {
    try {
      var l = localStorage.getItem('sahs.ciclos');
      var a = localStorage.getItem('sahs.cicloActivo');
      if (l) datos.lista = JSON.parse(l);
      if (a) datos.activo = Number(a);
    } catch (e) {}
    return datos;
  }
  function guardar() {
    try {
      localStorage.setItem('sahs.ciclos', JSON.stringify(datos.lista));
      localStorage.setItem('sahs.cicloActivo', String(datos.activo));
    } catch (e) {}
    try { if (canal) canal.postMessage('cambio'); } catch (e) {}
  }
  var api = {
    activo: function () { return leer().activo; },
    lista: function () {
      return leer().lista.slice().sort(function (a, b) { return b.anio - a.anio; });
    },
    info: function (anio) {
      var l = leer().lista;
      for (var i = 0; i < l.length; i++) if (l[i].anio === Number(anio)) return l[i];
      return null;
    },
    fijar: function (anio) { leer(); datos.activo = Number(anio); guardar(); avisar(); },
    agregar: function (c) { leer(); datos.lista.push(c); guardar(); avisar(); },
    escuchar: function (f) { oyentes.push(f); },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__cicloOyente) {
          this.__cicloOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        var v = original.call(this) || {};
        var act = api.activo();
        var inf = api.info(act);
        v.cicloG = {
          valor: String(act),
          estado: inf ? inf.estado : '',
          opciones: api.lista().map(function (c) {
            return { valor: String(c.anio), label: c.anio + ' · ' + c.estado.toLowerCase() };
          }),
          cambiar: function (e) { api.fijar(e.target.value); }
        };
        return v;
      };
    }
  };
  return api;
})();

      raiz.__SAHS_SESION = s;
    }
    return raiz.__SAHS_SESION;

    try { raiz.dispatchEvent(new CustomEvent('sahs-sesion')); } catch (e) {}
  }

  function completar(s) {
    var r = { id_usuario: s.id_usuario, nombre_user: s.nombre_user, nombre_rol: s.nombre_rol };
    var a = raiz.__SAHS_ACCESOS;
    if (a && a.usuarios) {
      a.usuarios.forEach(function (u) {
        if (u.id_usuario === s.id_usuario) {

          a.roles.forEach(function (rol) { if (rol.id_rol === u.id_rol) r.nombre_rol = rol.nombre_rol; });
        }
      });
    }
    return r;

    iniciada: function () { return !!guardada(); },
    usuario: function () { return completar(guardada() || POR_DEFECTO); },
    entrar: function (u, nombreRol) {
      var s = { id_usuario: u.id_usuario, nombre_user: u.nombre_user, nombre_rol: nombreRol };
      raiz.__SAHS_SESION = s;

    },
    salir: function () {

      try { raiz.sessionStorage.removeItem(CLAVE); } catch (e) {}
      avisar();

    conectar: function (C) {

      C.prototype.renderVals = function () {

/* Ciclo lectivo global: el mismo en todas las pantallas del administrativo.

  // Arma las horas cátedra de un turno: bloques de `dur` minutos y un recreo cada `cada` horas.
  function generarFranjas(ini, fin, dur, recreo, cada) {
    var aMin = function (s) { var p = String(s).split(':'); return Number(p[0]) * 60 + Number(p[1]); };
    var aTxt = function (m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); };
    var t = aMin(ini), tope = aMin(fin), out = [], n = 0;
    if (!(dur > 0)) return out;
    while (t + dur <= tope && out.length < 16) {
      out.push([aTxt(t), aTxt(t + dur)]);
      t += dur; n++;
      if (cada > 0 && n % cada === 0) t += recreo;
    }
    return out;

      { n: 'Matemática',   a: 2, o: 'Básica', ar: 'Exactas',             h: 5, doc: ['Ángel Avellaneda', 'Juan Ramírez'], d: 'Funciones, proporcionalidad y estadística.' },

      { n: 'Matemática',   a: 4, o: 'Economía', ar: 'Exactas',  h: 5, doc: ['Juan Ramírez', 'Ángel Avellaneda'], d: 'Funciones exponenciales, interés simple y compuesto.' },
      { n: 'Contabilidad', a: 4, o: 'Economía', ar: 'Sociales', h: 2, doc: ['Luca Tocce'], d: 'Registración contable y análisis de estados básicos.' },

      { n: 'Matemática',   a: 5, o: 'Economía', ar: 'Exactas',  h: 4, doc: ['Juan Ramírez', 'Ángel Avellaneda'], d: 'Matemática financiera.' },

      { n: 'Matemática',   a: 4, o: 'Educación', ar: 'Exactas',  h: 4, doc: ['Ángel Avellaneda', 'Juan Ramírez'], d: 'Funciones, estadística y su enseñanza.' },
      { n: 'Pedagogía',    a: 4, o: 'Educación', ar: 'Sociales', h: 3, doc: ['Silvia Ferreyra'], d: 'Teorías del aprendizaje y el rol docente.' },

  var copia = function (x) { return JSON.parse(JSON.stringify(x)); };
  var DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
  // Bloques de un día: las horas cátedra y, entre dos que no vienen seguidas, un recreo.
  // hora: número de hora cátedra (1, 2, …); null en los recreos.
  function bloquesDe(franjas) {
    var out = [], n = 0;
    (franjas || []).forEach(function (f, k) {
      if (k > 0 && franjas[k - 1][1] !== f[0]) out.push({ inicio: franjas[k - 1][1], fin: f[0], es_recreo: true, hora: null });
      out.push({ inicio: f[0], fin: f[1], es_recreo: false, hora: ++n });
    });
    return out;
  }
  var CLAVE = 'sahs.catalogo.v3';
  var datos = copia(BASE);
  try {
    if (window.top) {
      if (!window.top.__SAHS_CATALOGO) window.top.__SAHS_CATALOGO = datos;
      datos = window.top.__SAHS_CATALOGO;
    }
  } catch (e) {}
  var canal = null;
  try { canal = new BroadcastChannel('sahs-catalogo'); } catch (e) {}
  var oyentes = [];
  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }
  if (canal) canal.onmessage = avisar;
  try {
    window.addEventListener('storage', function (e) { if (e.key === CLAVE) avisar(); });
  } catch (e) {}
  function leer() {
    try {
      var g = localStorage.getItem(CLAVE);
      if (g) {
        var x = JSON.parse(g);
        datos.orientaciones = x.orientaciones; datos.materias = x.materias;
        datos.turnos = x.turnos || copia(BASE.turnos);
      }
    } catch (e) {}
    return datos;
  }
  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify({ orientaciones: datos.orientaciones, materias: datos.materias, turnos: datos.turnos })); } catch (e) {}
    try { if (canal) canal.postMessage('cambio'); } catch (e) {}
    avisar();
  }
  function buscarOr(nombre) {
    var l = datos.orientaciones;
    for (var i = 0; i < l.length; i++) if (l[i].nombre === nombre) return l[i];
    return null;
  }
  function mismaMateria(m, n, a, o) { return m.n.toLowerCase() === n.toLowerCase() && m.a === a && m.o === o; }
  function buscarTurno(nombre) {
    var l = datos.turnos || [];
    for (var i = 0; i < l.length; i++) if (l[i].nombre === nombre) return l[i];
    return null;
  }
  var api = {
    // ---- turnos: cada uno con su arreglo de franjas (horas cátedra) de lunes a viernes
    generarFranjas: generarFranjas,
    // ---- franjas como en el swagger: cada franja pertenece a un día lectivo y los
    // recreos también son franjas (es_recreo). El turno guarda solo sus horas cátedra;
    // los recreos se arman con el hueco entre dos horas que no vienen seguidas.
    DIAS: DIAS,
    bloques: function (nombre) {
      leer(); var t = buscarTurno(nombre);

    },
    franjasPorDia: function (nombre) {
      leer(); var t = buscarTurno(nombre);

    eliminarTurno: function (nombre) {

    orientacion: function (nombre) { leer(); var o = buscarOr(nombre); return o ? copia(o) : null; },
    orientacionesPara: function (anio) {

    },
    // p: cuántos docentes están habilitados. doc: quiénes (en orden de preferencia).
    materias: function () {
      return copia(leer().materias).map(function (m) { m.doc = m.doc || []; m.p = m.doc.length; return m; }).sort(function (x, y) {
        return x.a - y.a || x.o.localeCompare(y.o) || x.n.localeCompare(y.n);
      });
    },
    clave: function (m) { return m.n + '|' + m.a + '|' + m.o; },
    habilitar: function (n, a, o, docente) {
      leer();
      datos.materias.forEach(function (x) {
        if (mismaMateria(x, n, a, o)) { x.doc = x.doc || []; if (x.doc.indexOf(docente) < 0) x.doc.push(docente); }
      });
      guardar();
    },
    deshabilitar: function (n, a, o, docente) {
      leer();
      datos.materias.forEach(function (x) {
        if (mismaMateria(x, n, a, o)) x.doc = (x.doc || []).filter(function (d) { return d !== docente; });
      });
      guardar();
    },
    materiasDe: function (anio, orientacion) {
      return api.materias().filter(function (m) { return m.a === Number(anio) && m.o === orientacion; });
    },
    agregarMateria: function (m) {
      leer();
      if (!buscarOr(m.o)) return 'La orientación ' + m.o + ' no existe.';
      if (buscarOr(m.o).anios.indexOf(m.a) < 0) return 'La orientación ' + m.o + ' no está asociada a ' + m.a + '° año.';
      if (datos.materias.some(function (x) { return mismaMateria(x, m.n, m.a, m.o); })) {
        return m.n + ' ya existe en ' + m.a + '° año de la orientación ' + m.o + '.';
      }
      datos.materias.push({ n: m.n, a: m.a, o: m.o, ar: m.ar || '', h: m.h, doc: (m.doc || []).slice(), d: m.d || '' });
      guardar();
      return null;
    },
    quitarMateria: function (n, a, o) {
      leer();
      datos.materias = datos.materias.filter(function (x) { return !mismaMateria(x, n, a, o); });
      guardar();
    },
    cambiarHoras: function (n, a, o, h) {
      leer();
      datos.materias.forEach(function (x) { if (mismaMateria(x, n, a, o)) x.h = Math.max(1, Math.min(10, h)); });
      guardar();
    },
    crearOrientacion: function (o) {
      leer();
      var dup = datos.orientaciones.some(function (x) {
        return x.nombre.toLowerCase() === o.nombre.toLowerCase() || x.codigo === o.codigo;
      });
      if (dup) return 'Ya existe una orientación con ese nombre o ese código.';
      datos.orientaciones.push({ nombre: o.nombre, codigo: o.codigo, desc: o.desc || '', anios: (o.anios || []).slice().sort() });
      guardar();
      return null;
    },
    editarOrientacion: function (nombre, cambios) {
      leer();
      var o = buscarOr(nombre);
      if (!o) return 'No se encontró la orientación.';
      var dup = datos.orientaciones.some(function (x) {
        return x !== o && (x.nombre.toLowerCase() === cambios.nombre.toLowerCase() || x.codigo === cambios.codigo);
      });
      if (dup) return 'Ya existe otra orientación con ese nombre o ese código.';
      datos.materias.forEach(function (m) { if (m.o === nombre) m.o = cambios.nombre; });
      o.nombre = cambios.nombre; o.codigo = cambios.codigo; o.desc = cambios.desc;
      guardar();
      return null;
    },
    asociarAnio: function (nombre, anio) {
      leer();
      var o = buscarOr(nombre);
      if (o && o.anios.indexOf(anio) < 0) { o.anios.push(anio); o.anios.sort(); guardar(); }
    },
    desasociarAnio: function (nombre, anio) {
      leer();
      var n = datos.materias.filter(function (m) { return m.o === nombre && m.a === anio; }).length;
      if (n > 0) return 'Primero quitá las ' + (n === 1 ? 'materia' : n + ' materias') + ' de ' + anio + '° año de esta orientación.';
      var o = buscarOr(nombre);
      if (o) { o.anios = o.anios.filter(function (x) { return x !== anio; }); guardar(); }
      return null;
    },
    eliminarOrientacion: function (nombre) {
      leer();
      if (datos.materias.some(function (m) { return m.o === nombre; })) return 'Tiene materias cargadas: primero hay que quitarlas.';
      datos.orientaciones = datos.orientaciones.filter(function (x) { return x.nombre !== nombre; });
      guardar();
      return null;
    },

    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__catalogoOyente) {
          this.__catalogoOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        return original.call(this);
      };
    }
  };
  return api;
})();

/* Ciclo */
var CicloGlobal = (function () {
  var BASE = [
    { anio: 2025, inicio: '03/03/2025', fin: '12/12/2025', estado: 'Cerrado' },
    { anio: 2026, inicio: '02/03/2026', fin: '11/12/2026', estado: 'En curso' }
  ];
  var datos = { activo: 2026, lista: BASE.slice() };
  try {
    if (window.top) {
      if (!window.top.__SAHS_CICLO) window.top.__SAHS_CICLO = datos;
      datos = window.top.__SAHS_CICLO;
    }
  } catch (e) {}
  var canal = null;
  try { canal = new BroadcastChannel('sahs-ciclo'); } catch (e) {}
  var oyentes = [];
  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }
  if (canal) canal.onmessage = avisar;
  try {
    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf('sahs.') === 0) avisar();
    });
  } catch (e) {}
  function leer() {
    try {
      var l = localStorage.getItem('sahs.ciclos');
      var a = localStorage.getItem('sahs.cicloActivo');
      if (l) datos.lista = JSON.parse(l);
      if (a) datos.activo = Number(a);
    } catch (e) {}
    return datos;
  }
  function guardar() {
    try {
      localStorage.setItem('sahs.ciclos', JSON.stringify(datos.lista));
      localStorage.setItem('sahs.cicloActivo', String(datos.activo));
    } catch (e) {}
    try { if (canal) canal.postMessage('cambio'); } catch (e) {}
  }
  var api = {
    activo: function () { return leer().activo; },
    lista: function () {
      return leer().lista.slice().sort(function (a, b) { return b.anio - a.anio; });
    },
    info: function (anio) {
      var l = leer().lista;
      for (var i = 0; i < l.length; i++) if (l[i].anio === Number(anio)) return l[i];
      return null;
    },
    fijar: function (anio) { leer(); datos.activo = Number(anio); guardar(); avisar(); },
    agregar: function (c) { leer(); datos.lista.push(c); guardar(); avisar(); },
    escuchar: function (f) { oyentes.push(f); },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__cicloOyente) {
          this.__cicloOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        var v = original.call(this) || {};
        var act = api.activo();
        var inf = api.info(act);
        v.cicloG = {
          valor: String(act),
          estado: inf ? inf.estado : '',
          opciones: api.lista().map(function (c) {
            return { valor: String(c.anio), label: c.anio + ' · ' + c.estado.toLowerCase() };
          }),
          cambiar: function (e) { api.fijar(e.target.value); }
        };
        return v;
      };
    }
  };
  return api;
})();

    },
    clave: function (m) { return m.n + '|' + m.a + '|' + m.o; },
    habilitar: function (n, a, o, docente) {
      leer();
      datos.materias.forEach(function (x) {
        if (mismaMateria(x, n, a, o)) { x.doc = x.doc || []; if (x.doc.indexOf(docente) < 0) x.doc.push(docente); }
      });
      guardar();
    },
    deshabilitar: function (n, a, o, docente) {
      leer();
      datos.materias.forEach(function (x) {
        if (mismaMateria(x, n, a, o)) x.doc = (x.doc || []).filter(function (d) { return d !== docente; });
      });
      guardar();
    },
    materiasDe: function (anio, orientacion) {
      return api.materias().filter(function (m) { return m.a === Number(anio) && m.o === orientacion; });
    },
    agregarMateria: function (m) {
      leer();
      if (!buscarOr(m.o)) return 'La orientación ' + m.o + ' no existe.';
      if (buscarOr(m.o).anios.indexOf(m.a) < 0) return 'La orientación ' + m.o + ' no está asociada a ' + m.a + '° año.';
      if (datos.materias.some(function (x) { return mismaMateria(x, m.n, m.a, m.o); })) {
        return m.n + ' ya existe en ' + m.a + '° año de la orientación ' + m.o + '.';
      }
      datos.materias.push({ n: m.n, a: m.a, o: m.o, ar: m.ar || '', h: m.h, doc: (m.doc || []).slice(), d: m.d || '' });
      guardar();
      return null;
    },
    quitarMateria: function (n, a, o) {
      leer();
      datos.materias = datos.materias.filter(function (x) { return !mismaMateria(x, n, a, o); });
      guardar();
    },
    cambiarHoras: function (n, a, o, h) {
      leer();
      datos.materias.forEach(function (x) { if (mismaMateria(x, n, a, o)) x.h = Math.max(1, Math.min(10, h)); });
      guardar();
    },
    crearOrientacion: function (o) {
      leer();
      var dup = datos.orientaciones.some(function (x) {
        return x.nombre.toLowerCase() === o.nombre.toLowerCase() || x.codigo === o.codigo;
      });
      if (dup) return 'Ya existe una orientación con ese nombre o ese código.';
      datos.orientaciones.push({ nombre: o.nombre, codigo: o.codigo, desc: o.desc || '', anios: (o.anios || []).slice().sort() });
      guardar();
      return null;
    },
    editarOrientacion: function (nombre, cambios) {
      leer();
      var o = buscarOr(nombre);
      if (!o) return 'No se encontró la orientación.';
      var dup = datos.orientaciones.some(function (x) {
        return x !== o && (x.nombre.toLowerCase() === cambios.nombre.toLowerCase() || x.codigo === cambios.codigo);
      });
      if (dup) return 'Ya existe otra orientación con ese nombre o ese código.';
      datos.materias.forEach(function (m) { if (m.o === nombre) m.o = cambios.nombre; });
      o.nombre = cambios.nombre; o.codigo = cambios.codigo; o.desc = cambios.desc;
      guardar();
      return null;
    },
    asociarAnio: function (nombre, anio) {
      leer();
      var o = buscarOr(nombre);
      if (o && o.anios.indexOf(anio) < 0) { o.anios.push(anio); o.anios.sort(); guardar(); }
    },
    desasociarAnio: function (nombre, anio) {
      leer();

      if (n > 0) return 'Primero quitá las ' + (n === 1 ? 'materia' : n + ' materias') + ' de ' + anio + '° año de esta orientación.';
      var o = buscarOr(nombre);
      if (o) { o.anios = o.anios.filter(function (x) { return x !== anio; }); guardar(); }
      return null;
    },
    eliminarOrientacion: function (nombre) {
      leer();
      if (datos.materias.some(function (m) { return m.o === nombre; })) return 'Tiene materias cargadas: primero hay que quitarlas.';
      datos.orientaciones = datos.orientaciones.filter(function (x) { return x.nombre !== nombre; });

  };
  return api;
})();

/* Ciclo */
var CicloGlobal = (function () {
  var BASE = [
    { anio: 2025, inicio: '03/03/2025', fin: '12/12/2025', estado: 'Cerrado' },
    { anio: 2026, inicio: '02/03/2026', fin: '11/12/2026', estado: 'En curso' }
  ];
  var datos = { activo: 2026, lista: BASE.slice() };
  try {
    if (window.top) {
      if (!window.top.__SAHS_CICLO) window.top.__SAHS_CICLO = datos;
      datos = window.top.__SAHS_CICLO;
    }
  } catch (e) {}
  var canal = null;
  try { canal = new BroadcastChannel('sahs-ciclo'); } catch (e) {}
  var oyentes = [];
  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }
  if (canal) canal.onmessage = avisar;
  try {
    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf('sahs.') === 0) avisar();
    });
  } catch (e) {}
  function leer() {
    try {
      var l = localStorage.getItem('sahs.ciclos');
      var a = localStorage.getItem('sahs.cicloActivo');
      if (l) datos.lista = JSON.parse(l);
      if (a) datos.activo = Number(a);
    } catch (e) {}
    return datos;
  }
  function guardar() {
    try {
      localStorage.setItem('sahs.ciclos', JSON.stringify(datos.lista));
      localStorage.setItem('sahs.cicloActivo', String(datos.activo));
    } catch (e) {}
    try { if (canal) canal.postMessage('cambio'); } catch (e) {}
  }
  var api = {
    activo: function () { return leer().activo; },
    lista: function () {
      return leer().lista.slice().sort(function (a, b) { return b.anio - a.anio; });
    },
    info: function (anio) {
      var l = leer().lista;
      for (var i = 0; i < l.length; i++) if (l[i].anio === Number(anio)) return l[i];
      return null;
    },
    fijar: function (anio) { leer(); datos.activo = Number(anio); guardar(); avisar(); },
    agregar: function (c) { leer(); datos.lista.push(c); guardar(); avisar(); },
    escuchar: function (f) { oyentes.push(f); },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__cicloOyente) {
          this.__cicloOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        var v = original.call(this) || {};
        var act = api.activo();
        var inf = api.info(act);
        v.cicloG = {
          valor: String(act),
          estado: inf ? inf.estado : '',
          opciones: api.lista().map(function (c) {
            return { valor: String(c.anio), label: c.anio + ' · ' + c.estado.toLowerCase() };
          }),
          cambiar: function (e) { api.fijar(e.target.value); }
        };
        return v;
      };
    }
  };
  return api;
})();

var CicloGlobal = (function () {
  var BASE = [
    { anio: 2025, inicio: '03/03/2025', fin: '12/12/2025', estado: 'Cerrado' },
    { anio: 2026, inicio: '02/03/2026', fin: '11/12/2026', estado: 'En curso' }
  ];
  var datos = { activo: 2026, lista: BASE.slice() };
  try {
    if (window.top) {
      if (!window.top.__SAHS_CICLO) window.top.__SAHS_CICLO = datos;
      datos = window.top.__SAHS_CICLO;
    }
  } catch (e) {}
  var canal = null;
  try { canal = new BroadcastChannel('sahs-ciclo'); } catch (e) {}
  var oyentes = [];
  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }
  if (canal) canal.onmessage = avisar;
  try {
    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf('sahs.') === 0) avisar();
    });
  } catch (e) {}
  function leer() {
    try {
      var l = localStorage.getItem('sahs.ciclos');
      var a = localStorage.getItem('sahs.cicloActivo');
      if (l) datos.lista = JSON.parse(l);
      if (a) datos.activo = Number(a);
    } catch (e) {}
    return datos;
  }
  function guardar() {
    try {
      localStorage.setItem('sahs.ciclos', JSON.stringify(datos.lista));
      localStorage.setItem('sahs.cicloActivo', String(datos.activo));
    } catch (e) {}
    try { if (canal) canal.postMessage('cambio'); } catch (e) {}
  }
  var api = {
    activo: function () { return leer().activo; },
    lista: function () {
      return leer().lista.slice().sort(function (a, b) { return b.anio - a.anio; });
    },
    info: function (anio) {
      var l = leer().lista;
      for (var i = 0; i < l.length; i++) if (l[i].anio === Number(anio)) return l[i];
      return null;
    },
    fijar: function (anio) { leer(); datos.activo = Number(anio); guardar(); avisar(); },
    agregar: function (c) { leer(); datos.lista.push(c); guardar(); avisar(); },
    escuchar: function (f) { oyentes.push(f); },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__cicloOyente) {
          this.__cicloOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        var v = original.call(this) || {};
        var act = api.activo();
        var inf = api.info(act);
        v.cicloG = {
          valor: String(act),
          estado: inf ? inf.estado : '',
          opciones: api.lista().map(function (c) {
            return { valor: String(c.anio), label: c.anio + ' · ' + c.estado.toLowerCase() };
          }),
          cambiar: function (e) { api.fijar(e.target.value); }
        };
        return v;
      };
    }
  };
  return api;
})();
