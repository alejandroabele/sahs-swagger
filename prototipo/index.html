    turno: function (nombre) { leer(); var t = buscarTurno(nombre); return t ? copia(t) : null; },
    guardarTurno: function (nombreViejo, t) {
      leer();
      var existente = nombreViejo ? buscarTurno(nombreViejo) : null;
      var dup = datos.turnos.some(function (x) {
        return x !== existente && (x.nombre.toLowerCase() === t.nombre.toLowerCase() || x.codigo === t.codigo);
      });
      if (dup) return 'Ya existe un turno con ese nombre o ese código.';
      var limpio = { nombre: t.nombre, codigo: t.codigo, inicio: t.inicio, fin: t.fin, dur: t.dur, recreo: t.recreo, cada: t.cada,
                     franjas: t.franjas.map(function (f) { return [f[0], f[1]]; }) };
      if (existente) { Object.keys(limpio).forEach(function (k) { existente[k] = limpio[k]; }); }
      else datos.turnos.push(limpio);
      guardar();
      return null;
    },
    eliminarTurno: function (nombre) {
      leer();
      datos.turnos = datos.turnos.filter(function (x) { return x.nombre !== nombre; });
      guardar();
    },
    orientaciones: function () { return copia(leer().orientaciones); },
    orientacion: function (nombre) { leer(); var o = buscarOr(nombre); return o ? copia(o) : null; },
    orientacionesPara: function (anio) {
      return api.orientaciones().filter(function (o) { return o.anios.indexOf(Number(anio)) >= 0; });
    },
    // p: cuántos docentes están habilitados. doc: quiénes (en orden de preferencia).
    materias: function () {
      return copia(leer().materias).map(function (m) { m.doc = m.doc || []; m.p = m.doc.length; return m; }).sort(function (x, y) {
        return x.a - y.a || x.o.localeCompare(y.o) || x.n.localeCompare(y.n);
      });
    },
    clave: function (m) { return m.n + '|' + m.a + '|' + m.o; },
    habilitar: function (n, a, o, docente) {
      leer();
      datos.materias.forEach(function (x) {
        if (mismaMateria(x, n, a, o)) { x.doc = x.doc || []; if (x.doc.indexOf(docente) < 0) x.doc.push(docente); }
      });
      guardar();
    },
    deshabilitar: function (n, a, o, docente) {
      leer();
      datos.materias.forEach(function (x) {
        if (mismaMateria(x, n, a, o)) x.doc = (x.doc || []).filter(function (d) { return d !== docente; });
      });
      guardar();
    },
    materiasDe: function (anio, orientacion) {
      return api.materias().filter(function (m) { return m.a === Number(anio) && m.o === orientacion; });
    },
    agregarMateria: function (m) {
      leer();
      if (!buscarOr(m.o)) return 'La orientación ' + m.o + ' no existe.';
      if (buscarOr(m.o).anios.indexOf(m.a) < 0) return 'La orientación ' + m.o + ' no está asociada a ' + m.a + '° año.';
      if (datos.materias.some(function (x) { return mismaMateria(x, m.n, m.a, m.o); })) {
        return m.n + ' ya existe en ' + m.a + '° año de la orientación ' + m.o + '.';
      }
      datos.materias.push({ n: m.n, a: m.a, o: m.o, ar: m.ar || '', h: m.h, doc: (m.doc || []).slice(), d: m.d || '' });
      guardar();
      return null;
    },
    quitarMateria: function (n, a, o) {
      leer();
      datos.materias = datos.materias.filter(function (x) { return !mismaMateria(x, n, a, o); });
      guardar();
    },
    cambiarHoras: function (n, a, o, h) {
      leer();
      datos.materias.forEach(function (x) { if (mismaMateria(x, n, a, o)) x.h = Math.max(1, Math.min(10, h)); });
      guardar();
    },
    crearOrientacion: function (o) {
      leer();
      var dup = datos.orientaciones.some(function (x) {
        return x.nombre.toLowerCase() === o.nombre.toLowerCase() || x.codigo === o.codigo;
      });
      if (dup) return 'Ya existe una orientación con ese nombre o ese código.';
      datos.orientaciones.push({ nombre: o.nombre, codigo: o.codigo, desc: o.desc || '', anios: (o.anios || []).slice().sort() });
      guardar();
      return null;
    },
    editarOrientacion: function (nombre, cambios) {
      leer();
      var o = buscarOr(nombre);
      if (!o) return 'No se encontró la orientación.';
      var dup = datos.orientaciones.some(function (x) {
        return x !== o && (x.nombre.toLowerCase() === cambios.nombre.toLowerCase() || x.codigo === cambios.codigo);
      });
      if (dup) return 'Ya existe otra orientación con ese nombre o ese código.';
      datos.materias.forEach(function (m) { if (m.o === nombre) m.o = cambios.nombre; });
      o.nombre = cambios.nombre; o.codigo = cambios.codigo; o.desc = cambios.desc;
      guardar();
      return null;
    },
    asociarAnio: function (nombre, anio) {
      leer();
      var o = buscarOr(nombre);
      if (o && o.anios.indexOf(anio) < 0) { o.anios.push(anio); o.anios.sort(); guardar(); }
    },
    desasociarAnio: function (nombre, anio) {
      leer();
      var n = datos.materias.filter(function (m) { return m.o === nombre && m.a === anio; }).length;
      if (n > 0) return 'Primero quitá las ' + (n === 1 ? 'materia' : n + ' materias') + ' de ' + anio + '° año de esta orientación.';
      var o = buscarOr(nombre);
      if (o) { o.anios = o.anios.filter(function (x) { return x !== anio; }); guardar(); }
      return null;
    },
    eliminarOrientacion: function (nombre) {
      leer();
      if (datos.materias.some(function (m) { return m.o === nombre; })) return 'Tiene materias cargadas: primero hay que quitarlas.';
      datos.orientaciones = datos.orientaciones.filter(function (x) { return x.nombre !== nombre; });
      guardar();
      return null;
    },
    escuchar: function (f) { oyentes.push(f); },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__catalogoOyente) {
          this.__catalogoOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        return original.call(this);
      };
    }
  };
  return api;
})();

/* Ciclo */
var CicloGlobal = (function () {
  var BASE = [
    { anio: 2025, inicio: '03/03/2025', fin: '12/12/2025', estado: 'Cerrado' },
    { anio: 2026, inicio: '02/03/2026', fin: '11/12/2026', estado: 'En curso' }
  ];
  var datos = { activo: 2026, lista: BASE.slice() };
  try {
    if (window.top) {
      if (!window.top.__SAHS_CICLO) window.top.__SAHS_CICLO = datos;
      datos = window.top.__SAHS_CICLO;
    }
  } catch (e) {}
  var canal = null;
  try { canal = new BroadcastChannel('sahs-ciclo'); } catch (e) {}
  var oyentes = [];
  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }
  if (canal) canal.onmessage = avisar;
  try {
    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf('sahs.') === 0) avisar();
    });
  } catch (e) {}
  function leer() {
    try {
      var l = localStorage.getItem('sahs.ciclos');
      var a = localStorage.getItem('sahs.cicloActivo');
      if (l) datos.lista = JSON.parse(l);
      if (a) datos.activo = Number(a);
    } catch (e) {}
    return datos;
  }
  function guardar() {
    try {
      localStorage.setItem('sahs.ciclos', JSON.stringify(datos.lista));
      localStorage.setItem('sahs.cicloActivo', String(datos.activo));
    } catch (e) {}
    try { if (canal) canal.postMessage('cambio'); } catch (e) {}
  }
  var api = {
    activo: function () { return leer().activo; },
    lista: function () {
      return leer().lista.slice().sort(function (a, b) { return b.anio - a.anio; });
    },
    info: function (anio) {
      var l = leer().lista;
      for (var i = 0; i < l.length; i++) if (l[i].anio === Number(anio)) return l[i];
      return null;
    },
    fijar: function (anio) { leer(); datos.activo = Number(anio); guardar(); avisar(); },
    agregar: function (c) { leer(); datos.lista.push(c); guardar(); avisar(); },
    escuchar: function (f) { oyentes.push(f); },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__cicloOyente) {
          this.__cicloOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        var v = original.call(this) || {};
        var act = api.activo();
        var inf = api.info(act);
        v.cicloG = {
          valor: String(act),
          estado: inf ? inf.estado : '',
          opciones: api.lista().map(function (c) {
            return { valor: String(c.anio), label: c.anio + ' · ' + c.estado.toLowerCase() };
          }),
          cambiar: function (e) { api.fijar(e.target.value); }
        };
        return v;
      };
    }
  };
  return api;
})();

  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }
  if (canal) canal.onmessage = avisar;

    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf('sahs.') === 0) avisar();
    });
  } catch (e) {}
  function leer() {
    try {

      if (l) datos.lista = JSON.parse(l);
      if (a) datos.activo = Number(a);
    } catch (e) {}
    return datos;
  }
  function guardar() {
    try {
      localStorage.setItem('sahs.ciclos', JSON.stringify(datos.lista));

    try { if (canal) canal.postMessage('cambio'); } catch (e) {}
  }

    info: function (anio) {

      return null;

    fijar: function (anio) { leer(); datos.activo = Number(anio); guardar(); avisar(); },

        '1B': {}, '2C': { mt2: ['aa'] }, '4A': {}, '4B': {}, '4C': {}
      }
    };
    this.sincronizar();
  }

  // Arma MAT (materias), HAB (una fila por docente habilitado; si la materia se dicta
  // de a varios, una sola fila con todos) y el plan de cada curso según año y orientación.
  sincronizar() {
    var self = this;
    var porNombre = {};
    Object.keys(this.T).forEach(function (t) { porNombre[self.T[t].n] = t; });
    var viejo = this.MAT || {};
    var MAT = {}, HAB = {};
    // Cachés que dependen de los turnos del catálogo: se recalculan en cada render.
    this.__rangos = {}; this.__disp = {}; this.__ordenes = {};
    if (!this.state.clases) this.state.clases = {};
    this.CURSOS.forEach(function (c) {
      if (!self.state.clases[c.id]) self.state.clases[c.id] = {};
      var n = self.franjasDe(c.id).length;
      var g = self.state.grillas[c.id];
      if (!g) g = self.state.grillas[c.id] = [[], [], [], [], []];
      for (var d = 0; d < 5; d++) {
        var fila = (g[d] || []).slice(0, n);
        while (fila.length < n) fila.push(null);
        g[d] = fila;
      }
    });
    this.limpiarClases(this.state.grillas, this.state.clases);
    Catalogo.materias().forEach(function (m) {
      var clave = Catalogo.clave(m);
      var k = self.CLAVES[clave] || ('x_' + clave.normalize('NFD').replace(/[^A-Za-z0-9]/g, '_'));
      MAT[k] = { n: m.n, ar: m.ar || 'Sin área', h: m.h, anio: m.a, or: m.o, juntos: !!m.juntos };
      var tids = m.doc.map(function (d) { return porNombre[d]; }).filter(Boolean);
      HAB[k] = m.juntos ? (tids.length ? [tids] : []) : tids.map(function (x) { return [x]; });
    });
    // Una materia que ya está en alguna grilla pero se quitó del catálogo sigue visible.
    Object.keys(this.state.grillas).forEach(function (cid) {
      self.state.grillas[cid].forEach(function (f) {
        f.forEach(function (x) {
          if (!x) return;
          var k = x.split('|')[0];
          if (!MAT[k]) {
            MAT[k] = viejo[k] ? Object.assign({}, viejo[k], { anio: -1 }) : { n: 'Materia quitada', ar: 'Sin área', h: 0, anio: -1, or: '' };
            HAB[k] = [];
          }
        });
      });
    });
    this.MAT = MAT;
    this.HAB = HAB;
    this.CURSOS.forEach(function (c) {
      c.plan = Object.keys(MAT).filter(function (k) {
        return MAT[k].anio === c.anio && MAT[k].or === c.or && (c.sinDictar || []).indexOf(k) < 0;
      });
    });
  }

  // ---- turnos: cada curso usa las horas cátedra de su turno. Los datos de la grilla se
  // indexan por hora (sl = 0, 1, …): los recreos son franjas propias del turno que solo se
  // intercalan al dibujar, así que nunca cuentan como horas ni se pueden ocupar.
  // Los choques entre cursos de distinto turno se miden por horario real.
  cursoPorId(cid) {
    var r = null;
    this.CURSOS.forEach(function (c) { if (c.id === cid) r = c; });
    return r;
  }
  franjasDe(cid) {
    var c = this.cursoPorId(cid);
    var t = c ? Catalogo.turno(c.turno) : null;
    return t ? t.franjas : [];
  }
  aMin(s) { var p = String(s).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
  horario(cid, sl) {
    var f = this.franjasDe(cid)[sl];
    return f ? [this.aMin(f[0]), this.aMin(f[1])] : [0, 0];
  }
  // Rangos horarios que declaró cada docente, por día. av marca horas del turno Mañana.
  rangos(tid) {
    if (this.__rangos[tid]) return this.__rangos[tid];
    var self = this, T = this.T[tid], extra = this.EXTRA[tid] || [];
    var man = Catalogo.turno('Mañana');
    var horasMan = man ? man.franjas : [];
    var porDia = [0, 1, 2, 3, 4].map(function (d) {
      var r = [];
      T.av[d].split('').forEach(function (c, k) {
        if (c === '1' && horasMan[k]) r.push([self.aMin(horasMan[k][0]), self.aMin(horasMan[k][1])]);
      });
      String(extra[d] || '').split(',').forEach(function (x) {
        if (!x) return;
        var p = x.split('-'); r.push([self.aMin(p[0]), self.aMin(p[1])]);
      });
      r.sort(function (a, b) { return a[0] - b[0]; });
      var unidos = [];
      r.forEach(function (x) {
        var u = unidos[unidos.length - 1];
        if (u && x[0] <= u[1]) u[1] = Math.max(u[1], x[1]); else unidos.push(x.slice());
      });
      return unidos;
    });
    this.__rangos[tid] = porDia;
    return porDia;
  }
  // Disponibilidad como en el swagger: el conjunto de ids de franja (de todos los turnos)
  // que caen dentro de lo declarado. Los recreos nunca se declaran disponibles.
  disponibilidad(tid) {
    if (this.__disp[tid]) return this.__disp[tid];
    var rg = this.rangos(tid), self = this, ids = {};
    Catalogo.turnos().forEach(function (t) {
      Catalogo.franjasPorDia(t.nombre).forEach(function (f) {
        if (f.es_recreo) return;
        var a = self.aMin(f.inicio), z = self.aMin(f.fin);
        if (rg[f.diaIndex].some(function (r) { return r[0] <= a && z <= r[1]; })) ids[f.id] = true;
      });
    });
    this.__disp[tid] = ids;
    return ids;
  }
  // Id de la franja que corresponde a la hora sl del curso el día d (salta los recreos).
  idFranja(cid, d, sl) {
    var c = this.cursoPorId(cid);
    if (!c) return null;
    var orden = this.__ordenes[c.turno];
    if (!orden) {
      var t = Catalogo.turno(c.turno);
      orden = { codigo: t ? t.codigo : '', porHora: [] };
      Catalogo.bloques(c.turno).forEach(function (b, k) { if (!b.es_recreo) orden.porHora[b.hora - 1] = k + 1; });
      this.__ordenes[c.turno] = orden;
    }
    var o = orden.porHora[sl];
    return o ? orden.codigo + '-' + (d + 1) + '-' + o : null;
  }
  disponible(tid, cid, d, sl) {
    var id = this.idFranja(cid, d, sl);
    return !!id && !!this.disponibilidad(tid)[id];
  }
  // En qué otro curso está dando clase ese docente a la misma hora (aunque sea otro turno).
  // Los docentes de cada celda salen de su clase (cl: clases de cada curso).
  ocupaEnGrillas(g, cl, tid, cid, d, sl) {
    var self = this;
    var h = this.horario(cid, sl);
    var donde = null;
    this.CURSOS.forEach(function (c) {
      if (c.id === cid || donde) return;
      self.franjasDe(c.id).forEach(function (f, sl2) {
        var a = self.aMin(f[0]), z = self.aMin(f[1]);
        if (a >= h[1] || z <= h[0]) return;
        var x = g[c.id][d][sl2];
        if (x && self.docsCelda(c.id, x, cl).indexOf(tid) >= 0) donde = c.nombre;
      });
    });
    return donde;
  }

  // Las celdas guardan solo la materia; `sel` (la opción elegida a la izquierda) es materia|docentes.
  matDe(clave) { return String(clave).split('|')[0]; }
  docsDe(clave) { return String(clave).split('|')[1].split('+'); }
  nombresDocs(docs) {
    var self = this;
    return (docs || []).map(function (t) { return self.T[t] ? self.T[t].n : t; }).join(' + ');
  }
  nombresDe(clave) { return this.nombresDocs(this.docsDe(clave)); }
  // Profesores de la clase (curso + materia): una sola lista para todas sus horas.
  docsClase(cid, matId, cl) {
    var c = (cl || this.state.clases)[cid] || {};
    return c[matId] && c[matId].length ? c[matId] : null;
  }
  docsCelda(cid, x, cl) { return x ? (this.docsClase(cid, this.matDe(x), cl) || []) : []; }
  clonarClases() {
    var cl = {}, st = this.state;
    Object.keys(st.clases).forEach(function (cid) {
      cl[cid] = {};
      Object.keys(st.clases[cid]).forEach(function (m) { cl[cid][m] = st.clases[cid][m].slice(); });
    });
    return cl;
  }
  // Una clase sin horas en la grilla deja de tener profesores asignados.
  limpiarClases(g, cl) {
    var self = this;
    Object.keys(cl).forEach(function (cid) {
      Object.keys(cl[cid]).forEach(function (m) {
        var usada = (g[cid] || []).some(function (f) { return f.some(function (x) { return x && self.matDe(x) === m; }); });
        if (!usada) delete cl[cid][m];
      });
    });
    return cl;
  }
  editable() { return this.state.estado === 'borrador'; }

  // Qué combinación de la lista corresponde a la clase de esta materia en el curso.
  // Si a la clase se le sumaron profesores, la combinación elegida sigue siendo la del titular.
  elegidaPara(cursoId, matId) {
    var docs = this.docsClase(cursoId, matId);
    if (!docs) return null;
    var combos = this.HAB[matId] || [];
    for (var i = 0; i < combos.length; i++) {
      var c = combos[i];
      if (c[0] === docs[0] && c.every(function (t) { return docs.indexOf(t) >= 0; })) return matId + '|' + c.join('+');
    }
    return matId + '|' + docs.join('+');
  }

  horasPuestas(cursoId, matId) {
    var self = this;
    var n = 0;
    this.state.grillas[cursoId].forEach(function (f) {
      f.forEach(function (x) { if (x && self.matDe(x) === matId) n++; });
    });
    return n;
  }

  ocupaEn(tid, d, sl, cursoId) {
    return this.ocupaEnGrillas(this.state.grillas, this.state.clases, tid, cursoId, d, sl);
  }

  // Para ubicar una hora valen los profesores de la clase; si la clase todavía no
  // tiene horas, los de la opción elegida.
  evaluar(clave, d, sl) {
    var self = this;
    var cursoId = this.state.curso;
    var matId = this.matDe(clave);
    var docs = this.docsClase(cursoId, matId) || this.docsDe(clave);
    if (this.state.grillas[cursoId][d][sl]) return { ok: false, tipo: 'ocupada' };
    if (docs.length === 0 || docs[0] === '') return { ok: false, tipo: 'sinDocente' };
    var enDia = this.state.grillas[cursoId][d].filter(function (x) {
      return x && self.matDe(x) === matId;
    }).length;
    if (enDia >= 2) return { ok: false, tipo: 'tope' };
    var noDeclaro = docs.some(function (t) { return !self.disponible(t, cursoId, d, sl); });
    if (noDeclaro) return { ok: false, tipo: 'noDeclaro' };
    var choque = null;
    docs.forEach(function (t) {
      var donde = self.ocupaEn(t, d, sl, cursoId);
      if (donde) choque = donde;
    });
    if (choque) return { ok: false, tipo: 'otroCurso', donde: choque };
    return { ok: true, tipo: 'libre' };
  }

  // Completa la planificación entera: recorre todos los cursos, respeta lo que ya está
  // ubicado a mano y va resolviendo primero lo más apretado (menos franjas posibles por
  // hora pendiente). Si la clase ya tiene profesores, usa esa lista para todas sus horas;
  // si no, toma el docente habilitado con más margen y lo deja como profesor de la clase.
  // Dentro del día ocupa antes las franjas que pocos docentes declararon.
  generarTodo() {
    var self = this;
    this.sincronizar();
    var g = this.clonarGrillas();
    var cl = this.clonarClases();

    var enDia = function (cid, d, mid) {
      return g[cid][d].filter(function (x) { return x && self.matDe(x) === mid; }).length;
    };
    var puestasDe = function (cid, mid) {
      var n = 0;
      g[cid].forEach(function (f) { f.forEach(function (x) { if (x && self.matDe(x) === mid) n++; }); });
      return n;
    };
    var docentesDe = function (cid, mid) { return self.docsClase(cid, mid, cl); };
    var puede = function (cid, combo, mid, d, sl) {
      if (g[cid][d][sl]) return false;
      if (enDia(cid, d, mid) >= 2) return false;
      if (combo.some(function (t) { return !self.disponible(t, cid, d, sl); })) return false;
      if (combo.some(function (t) { return !!self.ocupaEnGrillas(g, cl, t, cid, d, sl); })) return false;
      return true;
    };
    var cuenta = function (cid, combo, mid) {
      var n = 0;
      var nf = self.franjasDe(cid).length;
      for (var d = 0; d < 5; d++) { for (var sl = 0; sl < nf; sl++) { if (puede(cid, combo, mid, d, sl)) n++; } }
      return n;
    };

    var escasez = function (cid, d, sl) {
      return Object.keys(self.T).filter(function (t) { return self.disponible(t, cid, d, sl); }).length;
    };

    var tareas = [];
    this.CURSOS.forEach(function (c) {
      c.plan.forEach(function (mid) {
        var faltan = self.MAT[mid].h - puestasDe(c.id, mid);
        if (faltan > 0) tareas.push({ cid: c.id, mid: mid, faltan: faltan, docs: docentesDe(c.id, mid) });
      });
    });

    var ubicadas = 0;
    var sinUbicar = [];
    var vueltas = 0;
    while (tareas.length && vueltas < 400) {
      vueltas++;
      tareas.forEach(function (t) {
        var combos = t.docs ? [t.docs] : (self.HAB[t.mid] || []);
        var mejor = null, mejorN = -1;
        combos.forEach(function (c) {
          var n = cuenta(t.cid, c, t.mid);
          if (n > mejorN) { mejorN = n; mejor = c; }
        });
        t.combo = mejor;
        t.opciones = mejorN < 0 ? 0 : mejorN;
        t.holgura = t.opciones / t.faltan;
      });
      tareas.sort(function (a, b) { return (a.holgura - b.holgura) || (b.faltan - a.faltan); });

      var t = tareas[0];
      if (!t.combo || t.opciones === 0) {
        sinUbicar.push(self.MAT[t.mid].n + ' en ' + t.cid + ' (' + t.faltan + ' h)');
        tareas.shift();
        continue;
      }
      var dias = [0,1,2,3,4].slice().sort(function (a, b) {
        return enDia(t.cid, a, t.mid) - enDia(t.cid, b, t.mid) || a - b;
      });
      var puesto = false;
      for (var di = 0; di < dias.length && !puesto; di++) {
        var d = dias[di];
        var slots = self.franjasDe(t.cid).map(function (_, k) { return k; }).sort(function (a, b) {
          return escasez(t.cid, d, a) - escasez(t.cid, d, b) || a - b;
        });
        for (var si = 0; si < slots.length; si++) {
          var sl = slots[si];
          if (!puede(t.cid, t.combo, t.mid, d, sl)) continue;
          g[t.cid][d][sl] = t.mid;
          if (!cl[t.cid][t.mid]) cl[t.cid][t.mid] = t.combo.slice();
          puesto = true;
          ubicadas++;
          break;
        }
      }
      if (!puesto) { sinUbicar.push(self.MAT[t.mid].n + ' en ' + t.cid); tareas.shift(); continue; }
      t.faltan--;
      t.docs = cl[t.cid][t.mid];
      if (t.faltan === 0) tareas.shift();
    }
    return { grillas: g, clases: cl, ubicadas: ubicadas, sinUbicar: sinUbicar };
  }

  clonarGrillas() {
    var g = {};
    var st = this.state;
    Object.keys(st.grillas).forEach(function (k) {
      g[k] = st.grillas[k].map(function (f) { return f.slice(); });
    });
    return g;
  }

  renderVals() {
    this.sincronizar();
    var self = this;
    var st = this.state;
    var accent = this.props.accent || '#2f5fd0';
    var compacta = this.props.density === 'Compacta';
    var alto = compacta ? 52 : 62;
    var editable = this.editable();
    var estado = st.estado;

    var cursoActual = null;
    this.CURSOS.forEach(function (c) { if (c.id === st.curso) cursoActual = c; });
    var plan = cursoActual.plan;

    var totalPlan = 0;
    plan.forEach(function (id) { totalPlan += self.MAT[id].h; });
    var ubicadas = 0;
    st.grillas[st.curso].forEach(function (f) {
      f.forEach(function (x) { if (x) ubicadas++; });
    });
    var completo = ubicadas === totalPlan && totalPlan > 0;

    // La planificación es una sola: se envía a revisión cuando TODOS los cursos están completos.
    var globalPuestas = 0, globalTotal = 0, cursosCompletos = 0, faltantes = [];
    this.CURSOS.forEach(function (c) {
      var p = 0, t = 0;
      st.grillas[c.id].forEach(function (f) { f.forEach(function (x) { if (x) p++; }); });
      c.plan.forEach(function (id) { t += self.MAT[id].h; });
      globalPuestas += p; globalTotal += t;
      if (p === t) { cursosCompletos++; } else { faltantes.push(c.nombre + ' (' + (t - p) + ' h)'); }
    });
    var planCompleta = globalPuestas === globalTotal;

    var COLOR_ESTADO = {
      borrador: { punto: '#c08430', chip: '#fdf6ec', texto: '#a56a10', label: 'Borrador' },
      revision: { punto: '#3a6fd8', chip: '#eef3fc', texto: '#1e4099', label: 'En revisión' },
      validada: { punto: '#2f6b45', chip: '#e9f2ec', texto: '#2f6b45', label: 'Validada' }
    };

    var cursos = this.CURSOS.map(function (c, i) {
      var activo = st.curso === c.id;
      var puestas = 0, total = 0;
      st.grillas[c.id].forEach(function (f) { f.forEach(function (x) { if (x) puestas++; }); });
      c.plan.forEach(function (id) { total += self.MAT[id].h; });
      var listoCurso = puestas === total;
      return {
        label: c.nombre,
        badge: listoCurso ? '✓' : puestas + '/' + total,
        badgeEstilo: 'font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 9px; margin-left: 8px;'
          + (activo ? ' background: rgba(255,255,255,0.18); color: #fff;'
                    : ' background: #f2f4f7; color: #7a8393;'),
        estilo: 'display: flex; align-items: center; height: 34px; padding: 0 13px; font-size: 12.5px;'
          + ' font-weight: 500;'
          + ' border: 1px solid ' + (activo ? '#14181f' : '#e2e6ec') + ';'
          + ' background: ' + (activo ? '#14181f' : '#fff') + '; color: ' + (activo ? '#fff' : '#4a5462') + ';'
          + ' border-radius: ' + (i === 0 ? '7px 0 0 7px' : (i === self.CURSOS.length - 1 ? '0 7px 7px 0' : '0')) + ';'
          + (i > 0 ? ' margin-left: -1px;' : ''),
        click: function () { self.setState({ curso: c.id, sel: null, celda: null, vaciando: false, aviso: null }); }
      };
    });

    // ---- una fila por materia × docente habilitado
    var opcionesLista = [];
    plan.forEach(function (matId, mi) {
      var m = self.MAT[matId];
      var col = self.AREAS[m.ar];
      var combos = self.HAB[matId] || [];
      var elegida = self.elegidaPara(st.curso, matId);
      var puestas = self.horasPuestas(st.curso, matId);
      var completa = puestas >= m.h;

      if (combos.length === 0) {
        opcionesLista.push({
          clase: 'fila-off',
          nombre: m.n,
          docente: 'Sin docente habilitado',
          marcaEstilo: 'width: 4px; height: 30px; border-radius: 3px; flex-shrink: 0; background: #dfe4ea;',
          nombreEstilo: 'font-size: 13px; font-weight: 500; color: #a8b0bb;',
          docenteEstilo: 'font-size: 11px; color: #b03a2e;',
          progreso: '0/' + m.h + ' h',
          progresoEstilo: 'font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 11px;'
            + ' flex-shrink: 0; background: #fbeceb; color: #b03a2e;',
          filaEstilo: 'display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 16px;'
            + ' border: none; text-align: left; background: #fff;'
            + (mi === 0 ? '' : ' border-top: 2px solid #eef1f5;'),
          click: function () {}
        });
        return;
      }

      combos.forEach(function (docs, ci) {
        var clave = matId + '|' + docs.join('+');
        var esElegida = elegida === clave;
        // Si otra combinación de esta materia ya está en la planilla, esta queda deshabilitada.
        var bloqueada = !!elegida && !esElegida;
        var activa = st.sel === clave;
        var puedeTocar = editable && !bloqueada && !(completa && !esElegida);

        opcionesLista.push({
          clase: puedeTocar ? '' : 'fila-off',
          nombre: m.n,
          docente: bloqueada
            ? 'La dicta ' + self.nombresDocs(self.docsClase(st.curso, matId))
            : docs.map(function (t) { return self.T[t].n; }).join(' + '),
          marcaEstilo: 'width: 4px; height: 30px; border-radius: 3px; flex-shrink: 0;'
            + ' background: ' + (bloqueada ? '#e8ecf1' : (completa && esElegida ? '#cdd4dd' : col.punto)) + ';',
          nombreEstilo: 'font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden;'
            + ' text-overflow: ellipsis;'
            + ' color: ' + (bloqueada ? '#b9c1cc' : (completa && esElegida ? '#8b95a5' : '#14181f')) + ';',
          docenteEstilo: 'font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;'
            + ' color: ' + (bloqueada ? '#c3cad4' : '#8b95a5') + ';'
            + (bloqueada ? ' font-style: italic;' : ''),
          progreso: bloqueada ? '—' : (completa && esElegida ? '✓ ' + m.h + ' h' : (esElegida ? puestas : 0) + '/' + m.h + ' h'),
          progresoEstilo: 'font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 11px; flex-shrink: 0;'

  var BASE = [
    { anio: 2025, inicio: '03/03/2025', fin: '12/12/2025', estado: 'Cerrado' },

    if (window.top) {
      if (!window.top.__SAHS_CICLO) window.top.__SAHS_CICLO = datos;
      datos = window.top.__SAHS_CICLO;
    }
  } catch (e) {}
  var canal = null;
  try { canal = new BroadcastChannel('sahs-ciclo'); } catch (e) {}
  var oyentes = [];
  function avisar() { oyentes.forEach(function (f) { try { f(); } catch (e) {} }); }
  if (canal) canal.onmessage = avisar;
  try {
    window.addEventListener('storage', function (e) {
      if (e.key && e.key.indexOf('sahs.') === 0) avisar();
    });
  } catch (e) {}
  function leer() {
    try {
      var l = localStorage.getItem('sahs.ciclos');
      var a = localStorage.getItem('sahs.cicloActivo');
      if (l) datos.lista = JSON.parse(l);
      if (a) datos.activo = Number(a);
    } catch (e) {}
    return datos;
  }
  function guardar() {
    try {
      localStorage.setItem('sahs.ciclos', JSON.stringify(datos.lista));
      localStorage.setItem('sahs.cicloActivo', String(datos.activo));
    } catch (e) {}
    try { if (canal) canal.postMessage('cambio'); } catch (e) {}
  }
  var api = {
    activo: function () { return leer().activo; },
    lista: function () {
      return leer().lista.slice().sort(function (a, b) { return b.anio - a.anio; });
    },
    info: function (anio) {
      var l = leer().lista;
      for (var i = 0; i < l.length; i++) if (l[i].anio === Number(anio)) return l[i];
      return null;
    },
    fijar: function (anio) { leer(); datos.activo = Number(anio); guardar(); avisar(); },
    agregar: function (c) { leer(); datos.lista.push(c); guardar(); avisar(); },
    escuchar: function (f) { oyentes.push(f); },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__cicloOyente) {
          this.__cicloOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        var v = original.call(this) || {};
        var act = api.activo();

          estado: inf ? inf.estado : '',
          opciones: api.lista().map(function (c) {
            return { valor: String(c.anio), label: c.anio + ' · ' + c.estado.toLowerCase() };
          }),
          cambiar: function (e) { api.fijar(e.target.value); }
        };
        return v;
      };
    }
  };
  return api;
})();

var Sesion = (function () {
  var CLAVE = 'sahs.sesion';

      raiz.__SAHS_SESION = s;

  function avisar() {
    try { raiz.dispatchEvent(new CustomEvent('sahs-sesion')); } catch (e) {}
  }

  function completar(s) {

    var a = raiz.__SAHS_ACCESOS;

        }
      });

      if (e.key && e.key.indexOf('sahs.') === 0) avisar();

    try {
      var l = localStorage.getItem('sahs.ciclos');

    info: function (anio) {

      return null;
    },
    fijar: function (anio) { leer(); datos.activo = Number(anio); guardar(); avisar(); },
    agregar: function (c) { leer(); datos.lista.push(c); guardar(); avisar(); },

          this.__cicloOyente = true;

var Sesion = (function () {
  var CLAVE = 'sahs.sesion';

  var raiz = window;

      raiz.__SAHS_SESION = s;
    }

  function avisar() {
    try { raiz.dispatchEvent(new CustomEvent('sahs-sesion')); } catch (e) {}
  }

  function completar(s) {
    var r = { id_usuario: s.id_usuario, nombre_user: s.nombre_user, nombre_rol: s.nombre_rol };
    var a = raiz.__SAHS_ACCESOS;

        }

    clave: function (m) { return m.n + '|' + m.a + '|' + m.o; },
    habilitar: function (n, a, o, docente) {
      leer();
      datos.materias.forEach(function (x) {
        if (mismaMateria(x, n, a, o)) { x.doc = x.doc || []; if (x.doc.indexOf(docente) < 0) x.doc.push(docente); }
      });
      guardar();
    },
    deshabilitar: function (n, a, o, docente) {
      leer();
      datos.materias.forEach(function (x) {
        if (mismaMateria(x, n, a, o)) x.doc = (x.doc || []).filter(function (d) { return d !== docente; });
      });
      guardar();
    },
    materiasDe: function (anio, orientacion) {
      return api.materias().filter(function (m) { return m.a === Number(anio) && m.o === orientacion; });
    },
    agregarMateria: function (m) {
      leer();
      if (!buscarOr(m.o)) return 'La orientación ' + m.o + ' no existe.';
      if (buscarOr(m.o).anios.indexOf(m.a) < 0) return 'La orientación ' + m.o + ' no está asociada a ' + m.a + '° año.';
      if (datos.materias.some(function (x) { return mismaMateria(x, m.n, m.a, m.o); })) {
        return m.n + ' ya existe en ' + m.a + '° año de la orientación ' + m.o + '.';
      }
      datos.materias.push({ n: m.n, a: m.a, o: m.o, ar: m.ar || '', h: m.h, doc: (m.doc || []).slice(), d: m.d || '' });
      guardar();
      return null;
    },
    quitarMateria: function (n, a, o) {
      leer();
      datos.materias = datos.materias.filter(function (x) { return !mismaMateria(x, n, a, o); });
      guardar();
    },
    cambiarHoras: function (n, a, o, h) {
      leer();
      datos.materias.forEach(function (x) { if (mismaMateria(x, n, a, o)) x.h = Math.max(1, Math.min(10, h)); });
      guardar();
    },
    crearOrientacion: function (o) {
      leer();
      var dup = datos.orientaciones.some(function (x) {
        return x.nombre.toLowerCase() === o.nombre.toLowerCase() || x.codigo === o.codigo;
      });
      if (dup) return 'Ya existe una orientación con ese nombre o ese código.';
      datos.orientaciones.push({ nombre: o.nombre, codigo: o.codigo, desc: o.desc || '', anios: (o.anios || []).slice().sort() });
      guardar();
      return null;
    },
    editarOrientacion: function (nombre, cambios) {
      leer();
      var o = buscarOr(nombre);
      if (!o) return 'No se encontró la orientación.';
      var dup = datos.orientaciones.some(function (x) {
        return x !== o && (x.nombre.toLowerCase() === cambios.nombre.toLowerCase() || x.codigo === cambios.codigo);
      });
      if (dup) return 'Ya existe otra orientación con ese nombre o ese código.';
      datos.materias.forEach(function (m) { if (m.o === nombre) m.o = cambios.nombre; });
      o.nombre = cambios.nombre; o.codigo = cambios.codigo; o.desc = cambios.desc;
      guardar();
      return null;
    },
    asociarAnio: function (nombre, anio) {
      leer();
      var o = buscarOr(nombre);
      if (o && o.anios.indexOf(anio) < 0) { o.anios.push(anio); o.anios.sort(); guardar(); }
    },
    desasociarAnio: function (nombre, anio) {
      leer();
      var n = datos.materias.filter(function (m) { return m.o === nombre && m.a === anio; }).length;
      if (n > 0) return 'Primero quitá las ' + (n === 1 ? 'materia' : n + ' materias') + ' de ' + anio + '° año de esta orientación.';
      var o = buscarOr(nombre);
      if (o) { o.anios = o.anios.filter(function (x) { return x !== anio; }); guardar(); }
      return null;
    },
    eliminarOrientacion: function (nombre) {
      leer();
      if (datos.materias.some(function (m) { return m.o === nombre; })) return 'Tiene materias cargadas: primero hay que quitarlas.';
      datos.orientaciones = datos.orientaciones.filter(function (x) { return x.nombre !== nombre; });
      guardar();
      return null;
    },
    escuchar: function (f) { oyentes.push(f); },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var self = this;
        if (!this.__catalogoOyente) {
          this.__catalogoOyente = true;
          api.escuchar(function () { self.setState({}); });
        }
        return original.call(this);
      };
    }
  };
  return api;
})();


class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Misma disponibilidad que la vista administrativa tiene registrada para Juan Ramírez:
    // horas cátedra del turno Mañana, de lunes a viernes.
    var ids = this.idsDe('Mañana', ['111110','111110','111100','111110','111100']);
    // La disponibilidad es una lista de ids de franja (de uno o más turnos).
    this.state = { disp: ids, turno: this.turnoPreferido(ids), guardado: false };
  }

  // Pasa los datos de ejemplo (una fila por día, '1' = disponible en esa hora cátedra,
  // en el orden del turno) a ids de franja del turno (ej. 'TM-1-3'). Los recreos nunca se marcan.
  idsDe(turno, filas) {
    var out = [];
    Catalogo.franjasPorDia(turno).forEach(function (f) {
      var fila = filas[f.diaIndex] || '';
      if (!f.es_recreo && fila.charAt(f.hora - 1) === '1') out.push(f.id);
    });
    return out;
  }

  // Ids de las horas cátedra (sin recreos) de un turno.
  horasDe(turno) {
    return Catalogo.franjasPorDia(turno)
      .filter(function (f) { return !f.es_recreo; })
      .map(function (f) { return f.id; });
  }

  // Cuántas franjas válidas (de algún turno, sin recreos) hay en la lista.
  contarEn(ids, turno) {
    var set = {};
    ids.forEach(function (id) { set[id] = true; });
    var nombres = turno ? [turno] : Catalogo.turnos().map(function (t) { return t.nombre; });
    var n = 0, self = this;
    nombres.forEach(function (t) { self.horasDe(t).forEach(function (id) { if (set[id]) n++; }); });
    return n;
  }

  // El turno donde hay más franjas declaradas; si no hay ninguna, Mañana (o el primero).
  turnoPreferido(ids) {
    var self = this, mejor = null, max = 0;
    var turnos = Catalogo.turnos();
    turnos.forEach(function (t) {
      var n = self.contarEn(ids, t.nombre);
      if (n > max) { max = n; mejor = t.nombre; }
    });
    if (mejor) return mejor;
    return turnos.some(function (t) { return t.nombre === 'Mañana'; }) ? 'Mañana' : (turnos[0] ? turnos[0].nombre : '');
  }

  // Arma la grilla del turno: una fila por bloque (horas y recreos) y una columna por día.
  grilla(turno, ids, alto, alternar) {
    var set = {};
    ids.forEach(function (id) { set[id] = true; });
    var bloques = Catalogo.bloques(turno);
    var porClave = {};
    Catalogo.franjasPorDia(turno).forEach(function (f) { porClave[f.diaIndex + '-' + f.orden] = f; });
    return bloques.map(function (b, k) {
      var horario = b.inicio + ' – ' + b.fin;
      if (b.es_recreo) return { esRecreo: true, esHora: false, hora: '', horario: horario, celdas: [] };
      var celdas = Catalogo.DIAS.map(function (dia, d) {
        var f = porClave[d + '-' + k];
        var libre = !!(f && set[f.id]);
        return {
          label: libre ? 'Disponible' : '',
          estilo: 'height: ' + alto + 'px; width: 100%; border-radius: 7px; font-size: 10.5px; font-weight: 500;'
            + ' display: flex; align-items: center; justify-content: center;'
            + (libre
                ? ' background: #e9f2ec; border: 1px solid #bfdcca; color: #2f6b45;'
                : ' background: #fafbfc; border: 1px dashed #d6dce4; color: transparent;'),
          click: function () { if (f) alternar(f.id); }
        };
      });
      return { esRecreo: false, esHora: true, hora: b.hora + 'ª hora', horario: horario, celdas: celdas };
    });
  }

  // Botones del selector de turno, con cuántas franjas hay declaradas en cada uno.
  botonesTurno(ids, actual, accent, elegir) {
    var self = this;
    return Catalogo.turnos().map(function (t) {
      var activo = t.nombre === actual;
      var n = self.contarEn(ids, t.nombre);
      return {
        nombre: t.nombre,
        cuenta: n,
        estilo: 'display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px;'
          + ' font-size: 12px; font-weight: 500;'
          + (activo ? ' border: 1.5px solid ' + accent + '; background: #eef3fc; color: #1e3f80;'
                    : ' border: 1px solid #dfe4ea; background: #fff; color: #4a5462;'),
        cuentaEstilo: 'font-size: 10.5px; padding: 1px 6px; border-radius: 8px;'
          + (n > 0 ? ' background: #e9f2ec; color: #2f6b45;' : ' background: #f2f4f7; color: #8b95a5;'),
        click: function () { elegir(t.nombre); }
      };
    });
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var accent = this.props.accent || '#2f5fd0';
    var compacta = this.props.density === 'Compacta';
    var alto = compacta ? 36 : 44;
    var turnos = Catalogo.turnos();
    var turno = turnos.some(function (t) { return t.nombre === st.turno; }) ? st.turno : this.turnoPreferido(st.disp);
    var info = Catalogo.turno(turno);

    var alternar = function (id) {
      var i = st.disp.indexOf(id);
      var nueva = i >= 0 ? st.disp.filter(function (x) { return x !== id; }) : st.disp.concat([id]);
      self.setState({ disp: nueva, guardado: false });
    };

    var declaradas = this.contarEn(st.disp);
    var enTurno = this.contarEn(st.disp, turno);
    var totalTurno = this.horasDe(turno).length;
    var otros = declaradas - enTurno;
    return {
      accent: accent,
      turnos: this.botonesTurno(st.disp, turno, accent, function (t) { self.setState({ turno: t }); }),
      turnoHorario: info ? info.inicio + ' a ' + info.fin + ' · ' + totalTurno / 5 + ' horas por día' : '',
      dias: Catalogo.DIAS.map(function (d) { return { nombre: d }; }),
      filas: this.grilla(turno, st.disp, alto, alternar),
      declaradas: declaradas,
      textoDeclaradas: 'franjas declaradas de ' + totalTurno,
      detalleDeclaradas: 'En el turno ' + turno + ': ' + enTurno + ' de ' + totalTurno + ' horas cátedra.'
        + (otros > 0 ? ' En otros turnos: ' + otros + '.' : ''),
      anchoDeclaradas: (totalTurno ? Math.round(enTurno / totalTurno * 100) : 0) + '%',
      textoGuardar: st.guardado ? 'Cambios guardados' : 'Guardar mi disponibilidad',
      guardarEstilo: 'height: 38px; padding: 0 18px; border-radius: 7px; border: none; font-size: 13px;'
        + ' font-weight: 600; color: #fff; background: ' + (st.guardado ? '#2f6b45' : accent) + ';',
      guardar: function () { self.setState({ guardado: true }); },
      // Marcar y limpiar actúan solo sobre el turno elegido (los recreos no se marcan).
      marcarTodo: function () {
        var nueva = st.disp.slice();
        self.horasDe(turno).forEach(function (id) { if (nueva.indexOf(id) < 0) nueva.push(id); });
        self.setState({ disp: nueva, guardado: false });
      },
      limpiar: function () {
        var delTurno = self.horasDe(turno);
        self.setState({ disp: st.disp.filter(function (id) { return delTurno.indexOf(id) < 0; }), guardado: false });
      }
    };
  }
}

Catalogo.conectar(Component);

return Component;

</script>

<script>
/* P4 · Mis recibos — lógica original de MisRecibos.dc.html */
DC.registrar("misrecibos", { Component: (function (DCLogic) {
/* Sesión: el usuario que entró por el Login (POST /usuario/login).
   La comparte toda la aplicación por window.top y se guarda en sessionStorage,
   así que sobrevive a una recarga en la misma pestaña. En el canvas del diseño
   nadie inició sesión y se muestra al usuario 1 (secretaria). */
var Sesion = (function () {
  var CLAVE = 'sahs.sesion';
  var POR_DEFECTO = { id_usuario: 1, nombre_user: 'secretaria', nombre_rol: 'Administrativo' };
  var raiz = window;
  try { if (window.top && window.top.document) raiz = window.top; } catch (e) {}
  function guardada() {
    if (raiz.__SAHS_SESION === undefined) {
      var s = null;
      try { s = JSON.parse(raiz.sessionStorage.getItem(CLAVE) || 'null'); } catch (e) {}
      raiz.__SAHS_SESION = s;
    }
    return raiz.__SAHS_SESION;
  }
  function avisar() {
    try { raiz.dispatchEvent(new CustomEvent('sahs-sesion')); } catch (e) {}
  }
  // Nombre y rol al día: si Usuarios cambió el rol, se lee de los datos compartidos.
  function completar(s) {
    var r = { id_usuario: s.id_usuario, nombre_user: s.nombre_user, nombre_rol: s.nombre_rol };
    var a = raiz.__SAHS_ACCESOS;
    if (a && a.usuarios) {
      a.usuarios.forEach(function (u) {
        if (u.id_usuario === s.id_usuario) {
          r.nombre_user = u.nombre_user;
          a.roles.forEach(function (rol) { if (rol.id_rol === u.id_rol) r.nombre_rol = rol.nombre_rol; });
        }
      });
    }
    return r;
  }
  var api = {
    iniciada: function () { return !!guardada(); },
    usuario: function () { return completar(guardada() || POR_DEFECTO); },
    entrar: function (u, nombreRol) {
      var s = { id_usuario: u.id_usuario, nombre_user: u.nombre_user, nombre_rol: nombreRol };
      raiz.__SAHS_SESION = s;
      try { raiz.sessionStorage.setItem(CLAVE, JSON.stringify(s)); } catch (e) {}
      avisar();
    },
    salir: function () {
      raiz.__SAHS_SESION = null;
      try { raiz.sessionStorage.removeItem(CLAVE); } catch (e) {}
      avisar();
    },
    conectar: function (C) {
      var original = C.prototype.renderVals;
      C.prototype.renderVals = function () {
        var v = original.call(this) || {};
        var u = api.usuario();
        v.sesion = {
          nombre: u.nombre_user,
          rol: u.nombre_rol,
          iniciales: u.nombre_user.slice(0, 2).toUpperCase(),
          salir: function () { api.salir(); }
        };
        return v;
      };
    }
  };
  return api;
})();
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // 10 horas cátedra: 8 de Matemática (1° B y 1° A) y 2 de Informática (2° C).
    this.PERIODOS = [
      { mes: 'Agosto 2026',     pago: '05/09/2026', valorHora: 12600, sac: false },
      { mes: 'Julio 2026',      pago: '05/08/2026', valorHora: 12600, sac: false },
      { mes: 'Junio 2026',      pago: '04/07/2026', valorHora: 11350, sac: true  },
      { mes: 'Mayo 2026',       pago: '05/06/2026', valorHora: 11350, sac: false },
      { mes: 'Abril 2026',      pago: '06/05/2026', valorHora: 11350, sac: false },
      { mes: 'Marzo 2026',      pago: '05/04/2026', valorHora: 10900, sac: false }
    ];
    this.state = { sel: 0, firmados: { 3: '12/06/2026', 4: '09/05/2026', 5: '08/04/2026' }, descargado: null };
  }

  pesos(n) {
    var s = String(Math.round(n));
    var out = '';
    var c = 0;
    for (var i = s.length - 1; i >= 0; i--) {
      out = s.charAt(i) + out;
      c++;
      if (c % 3 === 0 && i > 0) out = '.' + out;
    }
    return '$ ' + out;
  }

  calcular(p) {
    var mat = p.valorHora * 8;
    var inf = p.valorHora * 2;
    var base = mat + inf;
    var antiguedad = base * 0.10;
    var sac = p.sac ? (base + antiguedad) / 2 : 0;
    var bruto = base + antiguedad + sac;
    var jub = bruto * 0.11;
    var obra = bruto * 0.03;
    var sind = bruto * 0.02;
    var desc = jub + obra + sind;
    return {
      mat: mat, inf: inf, antiguedad: antiguedad, sac: sac,
      bruto: bruto, jub: jub, obra: obra, sind: sind, desc: desc, neto: bruto - desc
    };
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var accent = this.props.accent || '#2f5fd0';

    var recibos = this.PERIODOS.map(function (p, i) {
      var c = self.calcular(p);
      var activo = st.sel === i;
      var firmado = !!st.firmados[i];
      return {

    var filaBase = 'padding: 10px 12px; border-bottom: 1px solid #f2f4f7;';
    var fila = function (nombre, cantidad, importe, resta) {
      return {
        nombre: nombre,
        cantidad: cantidad,
        importe: (resta ? '− ' : '') + self.pesos(importe),
        celdaNombre: filaBase + ' color: ' + (resta ? '#8a4b12' : '#14181f') + ';',
        celdaCant: filaBase + ' text-align: right; color: #6b7482;',
        celdaImporte: filaBase + ' text-align: right; font-weight: 500; color: '
          + (resta ? '#8a4b12' : '#14181f') + ';'
      };
    };

    var conceptos = [
      fila('Horas cátedra · Matemática (1° B y 1° A)', '8 h', c.mat, false),
      fila('Horas cátedra · Informática (2° C)', '2 h', c.inf, false),
      fila('Antigüedad', '10 %', c.antiguedad, false)
    ];
    if (p.sac) conceptos.push(fila('Sueldo anual complementario', '50 %', c.sac, false));
    conceptos.push(fila('Aporte jubilatorio', '11 %', c.jub, true));
    conceptos.push(fila('Obra social', '3 %', c.obra, true));
    conceptos.push(fila('Aporte sindical', '2 %', c.sind, true));

    var firmado = st.firmados[st.sel];
    var pendientes = this.PERIODOS.filter(function (x, i) { return !st.firmados[i]; }).length;

    return {
      accent: accent,
      recibos: recibos,
      detMes: p.mes,
      detFechaPago: p.pago,
      conceptos: conceptos,
      detBruto: this.pesos(c.bruto),
      detDescuentos: this.pesos(c.desc),
      detNeto: this.pesos(c.neto),
      pendientesTexto: pendientes === 0
        ? 'Todos los recibos firmados'
        : pendientes + (pendientes === 1 ? ' recibo sin firmar' : ' recibos sin firmar'),
      pendientesColor: pendientes === 0 ? '#2f6b45' : '#8a4b12',
      pendientesEstilo: 'display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 20px;'
        + ' border: 1px solid ' + (pendientes === 0 ? '#c2e0cd' : '#f0d3ae') + ';'
        + ' background: ' + (pendientes === 0 ? '#ecf5ef' : '#fdf1e3') + ';',
      sinFirmar: !firmado,
      yaFirmado: !!firmado,
      textoFirma: firmado ? 'Firmada el ' + firmado + ' por Juan Ramírez · DNI 30.123.456' : '',
      firmaEstilo: 'display: flex; align-items: center; margin-top: 20px; padding: 16px 18px; border-radius: 10px;'
        + ' border: 1px solid ' + (firmado ? '#c2e0cd' : '#e2e6ec') + ';'
        + ' background: ' + (firmado ? '#ecf5ef' : '#fafbfc') + ';',
      firmar: function () {

      },
      descargarTexto: st.descargado === st.sel ? 'Descargado' : 'Descargar PDF',

        + (st.descargado === st.sel
            ? ' border: 1px solid #c2e0cd; background: #ecf5ef; color: #2f6b45;'
            : ' border: 1px solid #d3d9e2; background: #fff; color: #14181f;'),
      descargar: function () { self.setState({ descargado: self.state.sel }); }
    };
  }
}

<script>
/* ===== navegación de la aplicación =====
   Sin sesión se muestra el Login (L1). Con sesión, la pantalla del hash (#A5)
   si el rol tiene su privilegio; si no, el inicio (A1). No hay menú propio del
   armazón: se navega desde las pantallas (tarjetas del inicio con
   data-privilegio, elementos con data-ir y algunos botones por su texto). */
(function () {
  'use strict';

  var props = { accent: '#2f5fd0', density: 'Cómoda' };
  var actual = null;
  var $ = function (s) { return document.querySelector(s); };
  var lienzo = $('#lienzo'), marco = $('#marco'), escena = $('#escena');

  /* ---------- sesión y privilegios (los mismos datos que usan las pantallas) ---------- */
  function sesion() {
    if (window.__SAHS_SESION === undefined) {
      var s = null;
      try { s = JSON.parse(sessionStorage.getItem('sahs.sesion') || 'null'); } catch (e) {}
      window.__SAHS_SESION = s;
    }
    return window.__SAHS_SESION;
  }
  function privilegiosDelRol() {
    var s = sesion(), a = window.__SAHS_ACCESOS;
    if (!s || !a) return [];
    var u = a.usuarios.filter(function (x) { return x.id_usuario === s.id_usuario; })[0];
    var r = u ? a.roles.filter(function (x) { return x.id_rol === u.id_rol; })[0] : null;
    return r ? r.privilegios : [];
  }
  function permitida(cod) {
    var p = CONFIG.pantallas[cod];
    if (!p) return false;
    if (p.publica) return true;
    if (!sesion()) return false;
    return p.privilegio == null || privilegiosDelRol().indexOf(p.privilegio) >= 0;
  }

  /* ---------- puentes: abren una ficha con la fila elegida en su listado ---------- */
  function elegir(destino, fn, valor) {
    destino.renderVals()[fn]({ target: { value: valor } });
  }
  var PUENTES = {
    materia: function (clave, d) {          // "Historia|1"
      var p = String(clave).split('|');
      var i = d.M.findIndex(function (m) { return m.n === p[0] && String(m.a) === p[1]; });
      if (i >= 0) elegir(d, 'setSel', String(i));
    },
    profesor: function (legajo, d) {        // "FAI-3388"
      var i = d.P.findIndex(function (p) { return p.leg === legajo; });
      if (i >= 0) elegir(d, 'setSel', String(i));
    },
    curso: function (clave, d) {            // "1° A|2026"
      var p = String(clave).split('|');
      var k = d.CURSOS.findIndex(function (c) { return c.anio + '° ' + c.div === p[0] && String(c.ciclo) === p[1]; });
      if (k >= 0) elegir(d, 'setModo', String(k));
    },
    cursoNuevo: function (_, d) { elegir(d, 'setModo', 'nuevo'); }
  };

  function abrir(cod, puente, valor) {
    if (puente && permitida(cod)) {
      var host = DC.host(CONFIG.pantallas[cod].id, props);
      PUENTES[puente](valor, host.instance);
    }
    ir(cod);
  }

  /* ---------- escala: la pantalla entra en el ancho de la ventana ---------- */
  function escalar() {
    if (!actual) return;
    var p = CONFIG.pantallas[actual];
    var k = Math.min(1, escena.clientWidth / p.w);
    lienzo.style.transform = 'scale(' + k + ')';
    marco.style.width = Math.round(p.w * k) + 'px';
    marco.style.height = Math.round(lienzo.scrollHeight * k) + 'px';
  }
  window.addEventListener('resize', escalar);
  if (window.ResizeObserver) new ResizeObserver(escalar).observe(lienzo);

  /* ---------- clics que navegan ---------- */
  var atajos = null;
  lienzo.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target : null;
    if (!t) return;
    var destino = null, puente = null;
    var conIr = t.closest('[data-ir]');
    var tarjeta = t.closest('[data-privilegio]');
    if (conIr) destino = conIr.getAttribute('data-ir');
    else if (tarjeta) destino = CONFIG.privilegios[tarjeta.getAttribute('data-privilegio')] || null;
    else if (atajos) {
      var b = t.closest('button');
      var txt = b ? b.textContent.trim() : '';
      for (var i = 0; b && i < atajos.length; i++) {
        if (txt.indexOf(atajos[i][0]) === 0) { destino = atajos[i][1]; puente = atajos[i][2]; break; }
      }
    }
    if (!destino) return;   // p. ej. una tarjeta Pendiente: la maneja la pantalla
    ev.stopPropagation();
    ev.preventDefault();
    abrir(destino, puente);
  }, true);

  /* ---------- mostrar una pantalla ---------- */
  function mostrar(pedida) {
    var cod = pedida;
    if (!sesion()) cod = 'L1';
    else if (cod === 'L1' || !permitida(cod)) cod = 'A1';
    if (cod !== pedida) history.replaceState(null, '', '#' + cod);

    var p = CONFIG.pantallas[cod];
    actual = cod;
    atajos = p.directo || null;
    var host = DC.host(p.id, props);

    /* Filas de un listado: cuando la pantalla marca una fila como elegida,
       se abre su ficha con esa fila cargada. */
    if (p.fila) {
      DC.defs[p.id].alRenderizar = function (inst) {
        if (actual !== cod) return;
        var v = inst.state[p.fila.campo];
        if (v == null) return;
        inst.state[p.fila.campo] = null;   // al volver, el listado aparece sin selección
        abrir(p.fila.ir, p.fila.puente, v);
      };
    }

    lienzo.innerHTML = '';
    lienzo.style.width = p.w + 'px';
    lienzo.appendChild(host.el);
    host.render();

    document.title = 'SAHS · ' + p.titulo;
    escena.scrollTop = 0;
    escalar();
  }

  function ir(cod) {
    if (location.hash === '#' + cod) mostrar(cod);
    else location.hash = cod;
  }

  /* Entrar y cerrar sesión: lo avisa el bloque Sesion de las pantallas. */
  window.addEventListener('sahs-sesion', function () { ir(sesion() ? 'A1' : 'L1'); });

  function desdeHash() { mostrar((location.hash || '').replace('#', '') || 'A1'); }
  window.addEventListener('hashchange', desdeHash);
  desdeHash();
})();
</script>
