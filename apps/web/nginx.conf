# nginx de la web SAHS: es la única puerta de entrada (:8100).
#   /                    build de React
#   /<servicio>/         API de cada servicio
#   /docs/               Swagger UI unificado (swagger-ui-dist), con los 6 servicios
#   /docs/<servicio>-json  OpenAPI de cada servicio (la fuente de verdad)
#   /prototipo/          prototipo HTML de referencia
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    # Redirecciones relativas: nginx escucha en 80 pero se publica en 8100.
    absolute_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;

    # API: /<servicio>/<operacion> → http://<servicio>:3000/<servicio>/<operacion>
    location /usuario/ { proxy_pass http://usuario:3000; }
    location /pago/ { proxy_pass http://pago:3000; }
    location /horarios/ { proxy_pass http://horarios:3000; }
    location /planificacion/ { proxy_pass http://planificacion:3000; }
    location /orientacion/ { proxy_pass http://orientacion:3000; }
    location /profesor-suplencias/ { proxy_pass http://profesor-suplencias:3000; }

    # OpenAPI de cada servicio. Son coincidencias exactas, así que le ganan a /docs/.
    location = /docs/usuario-json { proxy_pass http://usuario:3000/docs-json; }
    location = /docs/pago-json { proxy_pass http://pago:3000/docs-json; }
    location = /docs/horarios-json { proxy_pass http://horarios:3000/docs-json; }
    location = /docs/planificacion-json { proxy_pass http://planificacion:3000/docs-json; }
    location = /docs/orientacion-json { proxy_pass http://orientacion:3000/docs-json; }
    location = /docs/profesor-suplencias-json { proxy_pass http://profesor-suplencias:3000/docs-json; }

    # Swagger UI y prototipo: archivos estáticos, sin caer en el index.html de React.
    location = /docs { return 301 /docs/; }
    location /docs/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
    location = /prototipo { return 301 /prototipo/; }
    location /prototipo/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }

    # Assets con hash: caché larga. El resto de las rutas de la app devuelven index.html.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
