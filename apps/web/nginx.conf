# nginx de la web SAHS: sirve el build de React y redirige cada prefijo a su servicio.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;

    # API: /<servicio>/<operacion> → http://<servicio>:3000/<servicio>/<operacion>
    location /usuario/ { proxy_pass http://usuario:3000; }
    location /pago/ { proxy_pass http://pago:3000; }
    location /horarios/ { proxy_pass http://horarios:3000; }
    location /planificacion/ { proxy_pass http://planificacion:3000; }
    location /orientacion/ { proxy_pass http://orientacion:3000; }
    location /profesor_suplencias/ { proxy_pass http://profesor-suplencias:3000; }

    # Swagger de cada servicio: /docs/<servicio>/ (UI) y /docs/<servicio>-json (OpenAPI)
    location = /docs/usuario-json { proxy_pass http://usuario:3000/docs-json; }
    location /docs/usuario/ { proxy_pass http://usuario:3000/docs/; }
    location = /docs/pago-json { proxy_pass http://pago:3000/docs-json; }
    location /docs/pago/ { proxy_pass http://pago:3000/docs/; }
    location = /docs/horarios-json { proxy_pass http://horarios:3000/docs-json; }
    location /docs/horarios/ { proxy_pass http://horarios:3000/docs/; }
    location = /docs/planificacion-json { proxy_pass http://planificacion:3000/docs-json; }
    location /docs/planificacion/ { proxy_pass http://planificacion:3000/docs/; }
    location = /docs/orientacion-json { proxy_pass http://orientacion:3000/docs-json; }
    location /docs/orientacion/ { proxy_pass http://orientacion:3000/docs/; }
    location = /docs/profesor_suplencias-json { proxy_pass http://profesor-suplencias:3000/docs-json; }
    location /docs/profesor_suplencias/ { proxy_pass http://profesor-suplencias:3000/docs/; }

    # Assets con hash: caché larga. El resto de las rutas de la app devuelven index.html.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
