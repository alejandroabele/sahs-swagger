# nginx de la web SAHS: es la única puerta de entrada (:8100).
#   /                    build de React
#   /api/<servicio>/     API de cada servicio (y /api/planificaciones/, del servicio Planificación)
#   /docs/               Swagger UI unificado (swagger-ui-dist), con los 6 servicios
#   /docs/<servicio>-json  OpenAPI de cada servicio (la fuente de verdad)
#   /prototipo/          prototipo HTML de referencia
#   /arquitectura/       vista de arquitectura (contenedor arquitectura)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    # Redirecciones relativas: nginx escucha en 80 pero se publica en 8100.
    absolute_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;

    # DNS de Docker. Con el servicio en una variable, nginx vuelve a resolver el nombre (cada 10 s)
    # en lugar de quedarse con la IP del arranque: si un servicio se reinicia y Docker le da otra IP,
    # las rutas no quedan apuntando a otro servicio.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: /api/<servicio>/<recurso> → http://<servicio>:3000/<servicio>/<recurso> (nginx quita el /api).
    # Va bajo /api porque /planificaciones/... también son rutas de pantallas de la web.
    location ~ ^/api/(?<svc>usuario|pago|horarios|planificacion|orientacion|profesor-suplencias)/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$svc:3000;
    }
    location ~ ^/api/planificaciones(/|$) {
        set $svc planificacion;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$svc:3000;
    }

    # OpenAPI de cada servicio. Es una regex, así que le gana al prefijo /docs/.
    location ~ ^/docs/(?<svc>usuario|pago|horarios|planificacion|orientacion|profesor-suplencias)-json$ {
        rewrite ^ /docs-json break;
        proxy_pass http://$svc:3000;
    }

    # Swagger UI y prototipo: archivos estáticos, sin caer en el index.html de React.
    location = /docs { return 301 /docs/; }
    location /docs/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
    location = /prototipo { return 301 /prototipo/; }
    location /prototipo/ { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }

    # Vista de arquitectura: tiene su propio contenedor, que recibe la ruta completa.
    location = /arquitectura { return 301 /arquitectura/; }
    location /arquitectura/ {
        set $arq arquitectura;
        proxy_pass http://$arq:80;
    }

    # Assets con hash: caché larga. El resto de las rutas de la app devuelven index.html.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
