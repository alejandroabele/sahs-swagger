# nginx de la vista de arquitectura. El nginx de web le pasa /arquitectura/ tal cual.
#   /arquitectura/                       la app (cualquier ruta devuelve su index.html)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /arquitectura { return 301 /arquitectura/; }
    location /arquitectura/assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /arquitectura/ { try_files $uri /arquitectura/index.html; add_header Cache-Control "no-cache"; }
}
