# nginx de la vista de arquitectura. El nginx de web le pasa /arquitectura/ tal cual.
#   /arquitectura/                       la app (cualquier ruta devuelve su index.html)
#   /arquitectura/salud/<servicio>       /actuator/health del servicio, para el estado en vivo
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # DNS de Docker: el nombre del servicio se resuelve en cada pedido. Si un servicio
    # está detenido, el nombre no resuelve y la salud responde 502 (la app lo pinta en rojo).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/arquitectura/salud/(?<svc>usuario|pago|horarios|planificacion|orientacion|profesor-suplencias)$ {
        proxy_pass http://$svc:3000/actuator/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }
    # Solo los 6 servicios conocidos.
    location ~ ^/arquitectura/salud/ { return 404; }

    location = /arquitectura { return 301 /arquitectura/; }
    location /arquitectura/assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /arquitectura/ { try_files $uri /arquitectura/index.html; add_header Cache-Control "no-cache"; }
}
